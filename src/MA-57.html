<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>交错级数与莱布尼茨判别法</title>
<link rel="stylesheet" href="libs/katex.min.css">
<script defer src="libs/katex.min.js"></script>
<script defer src="libs/auto-render.min.js"></script>
<script src="libs/gsap.min.js"></script>
<script src="libs/d3.min.js"></script>
<style>
:root{--bg:#0f1420;--bg-panel:#161d2e;--bg-elevated:#1d263b;--border:#2a3550;--text:#e6ebf5;--text-muted:#8b96ad;--primary:#4f8cff;--primary-strong:#6ea8ff;--highlight:#ffb020;--success:#2dd4a7;--compare:#ff6b6b;--swap:#ff9f43;--danger:#ff5c7a;--radius:12px;--shadow:0 6px 24px rgba(0,0,0,.35);--font:"PingFang SC","Microsoft YaHei",-apple-system,sans-serif}
[data-theme="light"]{--bg:#f5f7fa;--bg-panel:#fff;--bg-elevated:#f0f3f8;--border:#dde3ec;--text:#1a2333;--text-muted:#6b7688;--primary:#3b82f6;--primary-strong:#2563eb;--highlight:#f59e0b;--success:#10b981;--compare:#ef4444;--swap:#f97316;--danger:#ef4444;--shadow:0 4px 16px rgba(0,0,0,.08)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.65;-webkit-font-smoothing:antialiased}
.page-wrap{max-width:1280px;margin:0 auto;padding:24px}
header.course-header{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:24px}
.course-header h1{font-size:22px;font-weight:700}
.course-header .badge{font-size:12px;color:var(--primary-strong);border:1px solid var(--primary);padding:2px 10px;border-radius:999px}
.section{background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:24px;box-shadow:var(--shadow)}
.section h2{font-size:18px;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.section h2 .num{width:26px;height:26px;border-radius:8px;background:var(--primary);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
.focus-pulse{animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 rgba(255,176,32,.7)}50%{box-shadow:0 0 0 10px rgba(255,176,32,0)}}
.control-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 16px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:16px;position:sticky;top:12px;z-index:10}
.ctrl-btn{font-family:var(--font);font-size:14px;font-weight:600;color:var(--text);background:var(--bg-panel);border:1px solid var(--border);border-radius:8px;padding:8px 16px;cursor:pointer;transition:all .15s ease}
.ctrl-btn:hover{border-color:var(--primary);color:var(--primary-strong);transform:translateY(-1px)}
.ctrl-btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.slider-group{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-muted)}
.slider-group input[type=range]{accent-color:var(--highlight);width:180px}
.slider-val{font-family:monospace;color:var(--highlight);font-weight:700;min-width:50px}
.viz-panel{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius);padding:16px;position:relative;min-height:460px}
.viz-panel svg{width:100%;height:100%;min-height:420px}
.subtitle-bar{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:var(--bg-elevated);border:1px solid var(--highlight);color:var(--highlight);padding:6px 16px;border-radius:999px;font-size:14px;font-weight:600;white-space:nowrap}
.pitfall-list{padding-left:16px}.pitfall-list li{margin-bottom:8px}.pitfall-list li::marker{color:var(--danger)}
.quiz-item{margin-bottom:16px}.quiz-item .opt{display:block;padding:8px 14px;margin-top:6px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:all .15s}.quiz-item .opt:hover{border-color:var(--primary)}.quiz-item .opt.correct{border-color:var(--success);color:var(--success)}.quiz-item .opt.wrong{border-color:var(--danger);color:var(--danger)}
.katex-holder{margin:6px 0}
.theme-float{position:fixed;top:14px;right:14px;z-index:9999;font-size:20px;background:var(--bg-panel);border:1px solid var(--border);border-radius:10px;padding:6px 12px;cursor:pointer;box-shadow:var(--shadow)}
@media(max-width:768px){.control-bar{position:static}}

/* ===== 移动端适配补丁（统一追加：公式可横向滚动、标题栏可换行、字幕可换行） ===== */
.katex-holder{overflow-x:auto;overflow-y:hidden}
.katex-display{margin:0.4em 0}
header.course-header{flex-wrap:wrap;gap:8px}
header.course-header h1{min-width:0;word-break:break-word}
@media(max-width:768px){
  .page-wrap{padding:12px}
  .section{padding:16px}
  .control-bar{position:static;gap:6px;padding:10px 12px}
  .ctrl-btn{padding:7px 12px;font-size:13px}
  .subtitle-bar{white-space:normal;max-width:94%;line-height:1.35;font-size:12.5px;text-align:center}
  header.course-header h1{font-size:18px}
}
</style>
</head>
<body>
<div class="page-wrap">
<header class="course-header"><h1>交错级数与莱布尼茨判别法</h1><span class="badge">A级 · MA-57</span></header>
<section class="section" id="intuition-section"><h2><span class="num">1</span>直觉引入</h2><div id="intuition-text"><p>交错级数 Σ(-1)ⁿ⁻¹/n = 1-1/2+1/3-1/4+... 正负交替。虽然绝对值级数 Σ1/n 发散，但交错级数本身收敛（收敛到 ln2）。莱布尼茨判别法：通项绝对值单调递减且趋于 0，交错级数就收敛。</p></div></section>
<section class="section" id="animation-section"><h2><span class="num">2</span>核心动画</h2>
<div class="control-bar"><button class="ctrl-btn primary" id="btn-play">▶ 播放</button><button class="ctrl-btn" id="btn-reset">↺ 重置</button><div class="slider-group"><span>项数 n</span><input type="range" id="slider-n" min="1" max="50" step="1" value="10"><span class="slider-val" id="val-n">10</span></div></div>
<div class="viz-panel"><svg id="viz"></svg><div class="subtitle-bar" id="subtitle">部分和震荡趋近 ln2（约0.693）</div></div>
</section>
<section class="section" id="derive-section"><h2><span class="num">3</span>公式推导</h2><div id="derive-katex"></div></section>
<section class="section" id="exam-section"><h2><span class="num">4</span>历年真题实战</h2><div id="exam-text"></div></section>
<section class="section" id="pitfall-section"><h2><span class="num">5</span>易错点</h2><ul class="pitfall-list" id="pitfall-list"></ul></section>
<section class="section" id="quiz-section"><h2><span class="num">6</span>自测</h2><div id="quiz-list"></div></section>
</div>
<button class="theme-float" id="theme-float-btn">🌙</button>
<script>
window.COURSEWARE_DATA={id:"MA-57",title:"交错级数与莱布尼茨判别法",intuition_text:"交错级数 Σ(-1)ⁿ⁻¹/n = 1-1/2+1/3-1/4+... 正负交替。虽然绝对值级数 Σ1/n 发散，但交错级数本身收敛（收敛到 ln2）。莱布尼茨判别法：通项绝对值单调递减且趋于 0，交错级数就收敛。",derivation:["\\sum \\frac{(-1)^{n-1}}{n} = 1-\\frac{1}{2}+\\frac{1}{3}-\\cdots = \\ln 2","\\text{莱布尼茨：} a_n \\text{ 单调递减且 } \\to 0 \\Rightarrow \\text{收敛}","\\text{条件收敛：本身收敛，绝对值发散}"],exam_text:"<b>【真题】</b>交错级数 Σ(-1)ⁿ⁻¹/n 的敛散性是？",exam_answer:"答案：条件收敛。本身收敛（莱布尼茨判别法），但绝对值级数 Σ1/n 发散。",pitfall_list:["莱布尼茨判别法要求：通项绝对值单调递减 + 趋于0。","条件收敛：本身收敛但绝对值发散。","交错级数通项趋于0是必要条件（不趋于0必发散）。"],quiz_list:[{question:"交错级数 Σ(-1)ⁿ⁻¹/n 敛散性？",options:["条件收敛","绝对收敛","发散","不确定"],correct:0},{question:"莱布尼茨判别法要求通项？",options:["单调递减趋于0","单调递增","不趋于0","发散"],correct:0}]};

let n=10;

function renderViz(){
  const svg=d3.select('#viz');svg.selectAll('*').remove();
  const W=840,H=440;
  svg.attr('viewBox',`0 0 ${W} ${H}`);
  const g=svg.append('g');
  const left=70, right=W-30, top=60, bottom=H-60;
  const toX=i=>left+(i/n)*(right-left);
  const toY=v=>bottom-(v)*(bottom-top);

  // 目标线 ln2 ≈ 0.693
  g.append('line').attr('x1',left).attr('y1',toY(0.693)).attr('x2',right).attr('y2',toY(0.693)).attr('stroke','var(--success)').attr('stroke-width',2).attr('stroke-dasharray','6,4');
  g.append('text').attr('x',right-10).attr('y',toY(0.693)-8).attr('text-anchor','end').attr('fill','var(--success)').attr('font-size',12).text('ln2 ≈ 0.693');

  // 部分和震荡轨迹
  let sum=0;
  const path=[];
  for(let i=1;i<=n;i++){
    sum += Math.pow(-1,i-1)/i;
    path.push([toX(i), toY(sum)]);
  }
  g.append('path').attr('d',path.map((p,i)=>`${i?'L':'M'}${p[0]},${p[1]}`).join('')).attr('fill','none').attr('stroke','var(--primary)').attr('stroke-width',2.5);

  const last=path[path.length-1];
  g.append('circle').attr('cx',last[0]).attr('cy',last[1]).attr('r',6).attr('fill','var(--highlight)').attr('class','focus-pulse');

  g.append('text').attr('x',20).attr('y',30).attr('fill','var(--highlight)').attr('font-size',14).attr('font-weight','700').text('部分和 S_n = '+sum.toFixed(3));
  document.getElementById('subtitle').textContent='前 '+n+' 项部分和震荡趋近 ln2';
  document.getElementById('val-n').textContent=n;
}
function renderAll(){renderViz()}
function renderDerive(){const el=document.getElementById('derive-katex');const lines=window.COURSEWARE_DATA.derivation;el.innerHTML=lines.map(l=>`<div class="katex-holder">$$${l}$$</div>`).join('');if(window.renderMathInElement)window.renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true}]});else if(window.katex){el.innerHTML='';lines.forEach(l=>{const d=document.createElement('div');d.className='katex-holder';el.appendChild(d);window.katex.render(l,d,{displayMode:true})})}}
function renderContent(){const d=window.COURSEWARE_DATA;document.getElementById('intuition-text').innerHTML=`<p>${d.intuition_text}</p>`;document.getElementById('exam-text').innerHTML=d.exam_text+`<p style="color:var(--success);margin-top:8px;">${d.exam_answer}</p>`;document.getElementById('pitfall-list').innerHTML=d.pitfall_list.map(x=>`<li>${x}</li>`).join('');document.getElementById('quiz-list').innerHTML=d.quiz_list.map((q,qi)=>`<div class="quiz-item"><p>${q.question}</p>${q.options.map((o,oi)=>`<span class="opt" data-correct="${oi===q.correct?1:0}">${o}</span>`).join('')}</div>`).join('');renderDerive()}
function bindQuiz(){document.querySelectorAll('.quiz-item .opt').forEach(opt=>{opt.addEventListener('click',()=>{const sib=opt.parentElement.querySelectorAll('.opt');sib.forEach(s=>s.classList.remove('correct','wrong'));opt.dataset.correct==='1'?opt.classList.add('correct'):opt.classList.add('wrong')})})}
function initTheme(){try{const s=localStorage.getItem('theme');if(s)document.documentElement.setAttribute('data-theme',s)}catch(e){}document.getElementById('theme-float-btn').textContent=document.documentElement.getAttribute('data-theme')==='light'?'☀️':'🌙'}
document.getElementById('theme-float-btn').addEventListener('click',()=>{const c=document.documentElement.getAttribute('data-theme');const n=c==='light'?'dark':'light';document.documentElement.setAttribute('data-theme',n);try{localStorage.setItem('theme',n)}catch(e){}document.getElementById('theme-float-btn').textContent=n==='light'?'☀️':'🌙'})
function init(){renderContent();bindQuiz();renderAll();document.getElementById('slider-n').addEventListener('input',e=>{n=+e.target.value;renderAll()});document.getElementById('btn-play').addEventListener('click',()=>{let p=1;const t=setInterval(()=>{p=Math.min(50,p+1);document.getElementById('slider-n').value=p;n=p;renderAll()},100)});document.getElementById('btn-reset').addEventListener('click',()=>{n=10;document.getElementById('slider-n').value=10;renderAll()})}
window.addEventListener('load',()=>{initTheme();if(window.gsap)gsap.from('.section',{opacity:0,y:20,duration:0.6,stagger:0.12,ease:'power2.out'});init()});
</script>
</body>
</html>
