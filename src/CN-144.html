<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OSI 参考模型</title>
<link rel="stylesheet" href="libs/katex.min.css">
<script defer src="libs/katex.min.js"></script>
<script defer src="libs/auto-render.min.js"></script>
<script src="libs/gsap.min.js"></script>
<script src="libs/d3.min.js"></script>
<style>
:root { --bg:#0f1420; --bg-panel:#161d2e; --bg-elevated:#1d263b; --border:#2a3550; --text:#e6ebf5; --text-muted:#8b96ad; --primary:#4f8cff; --primary-strong:#6ea8ff; --highlight:#ffb020; --success:#2dd4a7; --compare:#ff6b6b; --swap:#ff9f43; --danger:#ff5c7a; --radius:12px; --shadow:0 6px 24px rgba(0,0,0,0.35); --font:"PingFang SC","Microsoft YaHei",-apple-system,sans-serif; }
[data-theme="light"] { --bg:#f5f7fa; --bg-panel:#fff; --bg-elevated:#f0f3f8; --border:#dde3ec; --text:#1a2333; --text-muted:#6b7688; --primary:#3b82f6; --primary-strong:#2563eb; --highlight:#f59e0b; --success:#10b981; --compare:#ef4444; --swap:#f97316; --danger:#ef4444; --shadow:0 4px 16px rgba(0,0,0,0.08); }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:var(--font); background:var(--bg); color:var(--text); line-height:1.65; -webkit-font-smoothing:antialiased; }
.page-wrap { max-width:1280px; margin:0 auto; padding:24px; }
header.course-header { display:flex; align-items:center; justify-content:space-between; padding:16px 24px; background:var(--bg-panel); border:1px solid var(--border); border-radius:var(--radius); margin-bottom:24px; }
.course-header h1 { font-size:22px; font-weight:700; }
.course-header .badge { font-size:12px; color:var(--primary-strong); border:1px solid var(--primary); padding:2px 10px; border-radius:999px; }
.section { background:var(--bg-panel); border:1px solid var(--border); border-radius:var(--radius); padding:24px; margin-bottom:24px; box-shadow:var(--shadow); }
.section h2 { font-size:18px; margin-bottom:16px; display:flex; align-items:center; gap:8px; }
.section h2 .num { width:26px; height:26px; border-radius:8px; background:var(--primary); color:#fff; display:inline-flex; align-items:center; justify-content:center; font-size:14px; font-weight:700; }
.focus-pulse { animation:breathe 1.6s ease-in-out infinite; }
@keyframes breathe { 0%,100%{box-shadow:0 0 0 0 rgba(255,176,32,0.7);} 50%{box-shadow:0 0 0 10px rgba(255,176,32,0);} }
.control-bar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:12px 16px; background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius); margin-bottom:16px; position:sticky; top:12px; z-index:10; }
.ctrl-btn { font-family:var(--font); font-size:14px; font-weight:600; color:var(--text); background:var(--bg-panel); border:1px solid var(--border); border-radius:8px; padding:8px 16px; cursor:pointer; transition:all .15s ease; }
.ctrl-btn:hover { border-color:var(--primary); color:var(--primary-strong); transform:translateY(-1px); }
.ctrl-btn.primary { background:var(--primary); color:#fff; border-color:var(--primary); }
.viz-panel { background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius); padding:16px; position:relative; min-height:440px; }
.viz-panel svg { width:100%; height:auto; }
.subtitle-bar { position:absolute; bottom:12px; left:50%; transform:translateX(-50%); background:var(--bg-elevated); border:1px solid var(--highlight); color:var(--highlight); padding:6px 16px; border-radius:999px; font-size:14px; font-weight:600; white-space:nowrap; max-width:92%; overflow:hidden; text-overflow:ellipsis; }
.pitfall-list { padding-left:16px; } .pitfall-list li { margin-bottom:8px; } .pitfall-list li::marker { color:var(--danger); }
.quiz-item { margin-bottom:16px; }
.quiz-item .opt { display:block; padding:8px 14px; margin-top:6px; background:var(--bg-elevated); border:1px solid var(--border); border-radius:8px; cursor:pointer; transition:all .15s; }
.quiz-item .opt:hover { border-color:var(--primary); }
.quiz-item .opt.correct { border-color:var(--success); color:var(--success); }
.quiz-item .opt.wrong { border-color:var(--danger); color:var(--danger); }
.katex-holder { margin:6px 0; }
.theme-float { position:fixed; top:14px; right:14px; z-index:9999; font-size:20px; background:var(--bg-panel); border:1px solid var(--border); border-radius:10px; padding:6px 12px; cursor:pointer; box-shadow:var(--shadow); }
@media(max-width:768px){ .control-bar{position:static;} }

/* ===== 移动端适配补丁（统一追加：公式可横向滚动、标题栏可换行、字幕可换行） ===== */
.katex-holder{overflow-x:auto;overflow-y:hidden}
.katex-display{margin:0.4em 0}
header.course-header{flex-wrap:wrap;gap:8px}
header.course-header h1{min-width:0;word-break:break-word}
@media(max-width:768px){
  .page-wrap{padding:12px}
  .section{padding:16px}
  .control-bar{position:static;gap:6px;padding:10px 12px}
  .ctrl-btn{padding:7px 12px;font-size:13px}
  .subtitle-bar{white-space:normal;max-width:94%;line-height:1.35;font-size:12.5px;text-align:center}
  header.course-header h1{font-size:18px}
}
</style>
</head>
<body>
<div class="page-wrap">
<header class="course-header"><h1>OSI 参考模型</h1><span class="badge">C级 · CN-144</span></header>

<section class="section" id="intuition-section">
<h2><span class="num">1</span>直觉引入</h2>
<div id="intuition-text"><p>OSI（开放系统互连）模型把网络通信划成七层，从下到上依次是：<strong>物理层</strong>（比特在介质上传输）、<strong>数据链路层</strong>（相邻结点间帧传输，差错/流量控制）、<strong>网络层</strong>（路由选择、分组转发）、<strong>传输层</strong>（端到端通信，复用分用、可靠传输）、<strong>会话层</strong>（管理会话建立与同步）、<strong>表示层</strong>（数据格式转换、加密压缩）、<strong>应用层</strong>（直接为用户提供服务）。</p>
<p>记忆口诀：<strong>「物链网传会示用」</strong>。下层为上层提供服务，上层通过接口调用下层——每层处理的数据单元（PDU）都不同：比特→帧→分组→报文段。</p></div>
</section>

<section class="section" id="animation-section">
<h2><span class="num">2</span>核心动画</h2>
<div class="control-bar">
<button class="ctrl-btn primary" id="btn-play">▶ 播放</button>
<button class="ctrl-btn" id="btn-prev">⏮ 上一步</button>
<button class="ctrl-btn" id="btn-next">⏭ 下一步</button>
<button class="ctrl-btn" id="btn-reset">↺ 重置</button>
</div>
<div class="viz-panel"><svg id="viz"></svg><div class="subtitle-bar" id="subtitle"></div></div>
</section>

<section class="section" id="derive-section">
<h2><span class="num">3</span>公式推导</h2>
<div id="derive-katex"></div>
</section>

<section class="section" id="exam-section">
<h2><span class="num">4</span>历年真题实战</h2>
<div id="exam-text"></div>
</section>

<section class="section" id="skill-section" style="display:none;">
<h2><span class="num">💡</span>做题技巧</h2>
<div id="skill-content" style="line-height:1.9;"></div>
</section>
<section class="section" id="pitfall-section">
<h2><span class="num">5</span>易错点</h2>
<ul class="pitfall-list" id="pitfall-list"></ul>
</section>

<section class="section" id="quiz-section">
<h2><span class="num">6</span>自测</h2>
<div id="quiz-list"></div>
</section>
</div>

<button class="theme-float" id="theme-float-btn">🌙</button>

<script>
window.COURSEWARE_DATA = {
  id: "CN-144",
  title: "OSI 参考模型",
  derivation: [
    "\\text{OSI 七层（自下而上）}: \\; \\text{物理} \\to \\text{链路} \\to \\text{网络} \\to \\text{传输} \\to \\text{会话} \\to \\text{表示} \\to \\text{应用}",
    "\\text{口诀}: \\; \\text{「物链网传会示用」}",
    "\\text{各层 PDU}: \\; \\text{比特} \\to \\text{帧} \\to \\text{分组（包）} \\to \\text{报文段}",
    "\\text{低三层}: \\underbrace{\\text{通信子网}}_{\\text{资源子网之下}} \\; ; \\quad \\text{高三层} \\approx \\text{资源子网范畴}",
    "\\text{传输层是承上启下的一层}: \\; \\text{第一个端到端层次}"
  ],
  exam_text: "<b>【2017 真题改编】</b>OSI 参考模型中，提供端到端透明数据传输的是哪一层？完成路由选择的是哪一层？",
  exam_answer: "答案：提供<b>端到端</b>透明数据传输的是<b>传输层</b>（第一个端到端层次，屏蔽底层差异，向高层提供可靠/不可靠传输）；完成<b>路由选择与分组转发</b>的是<b>网络层</b>（IP 协议工作在这一层）。注意「差错控制」主要由数据链路层和传输层承担，是高频易混点。",
  pitfall_list: [
    "传输层是第一个「端到端」的层次（进程到进程），低三层只做到「相邻结点」级别的通信。",
    "「路由选择」只属于网络层；数据链路层只负责相邻结点间的帧交付，不做跨网路由。",
    "会话层、表示层在实际网络中基本被合并进应用层——OSI 的理想分层在 TCP/IP 中被简化。"
  ],
  quiz_list: [
    { question: "OSI 七层中，负责路由选择的是？", options: ["数据链路层", "网络层", "传输层"], correct: 1 },
    { question: "第一个提供端到端通信的层次是？", options: ["网络层", "传输层", "会话层"], correct: 1 },
    { question: "数据在数据链路层的传输单元是？", options: ["比特", "帧", "分组"], correct: 1 },
  ]
};

/* ===== CN-144 专属动画：七层逐层点亮 + PDU 变化 ===== */
const STEPS = [
  { focus:0, desc:'OSI 七层总览：物链网传会示用（自下而上）' },
  { focus:1, desc:'低三层（通信子网）：物理层比特 / 链路层帧 / 网络层分组' },
  { focus:2, desc:'传输层：第一个端到端层次，报文段，TCP/UDP 工作于此' },
  { focus:3, desc:'高三层（资源子网）：会话 / 表示 / 应用' },
  { focus:4, desc:'一次数据下行：每过一层加一个头部（封装），PDU 逐层变身' },
];

let stepIdx = 0, playing = false, playTimer = null;

function renderViz(){
  const svg = d3.select('#viz');
  svg.selectAll('*').remove();
  const W = 900, H = 400;
  svg.attr('viewBox', `0 0 ${W} ${H}`);
  const g = svg.append('g');
  const step = STEPS[stepIdx];
  const f = step.focus;

  g.append('text').attr('x', W/2).attr('y', 28).attr('text-anchor','middle')
    .attr('fill','var(--primary-strong)').attr('font-size',15).attr('font-weight','700')
    .text(['七层总览','低三层：通信子网','传输层','高三层：资源子网','数据下行封装'][f]);

  const L = [
    {n:'7 应用层', pdu:'报文', c:'var(--primary)', lo:3, hi:6, fn:'直接为用户提供服务'},
    {n:'6 表示层', pdu:'报文', c:'var(--primary)', lo:3, hi:6, fn:'格式转换/加密/压缩'},
    {n:'5 会话层', pdu:'报文', c:'var(--primary)', lo:3, hi:6, fn:'会话建立/管理/同步'},
    {n:'4 传输层', pdu:'报文段', c:'var(--highlight)', lo:2, hi:2, fn:'端到端可靠/不可靠传输'},
    {n:'3 网络层', pdu:'分组', c:'var(--success)', lo:1, hi:1, fn:'路由选择/分组转发'},
    {n:'2 数据链路层', pdu:'帧', c:'var(--success)', lo:1, hi:1, fn:'组帧/差错/流量控制'},
    {n:'1 物理层', pdu:'比特', c:'var(--success)', lo:1, hi:1, fn:'比特在介质上传输'},
  ];

  if(f<4){
    L.forEach((l,i)=>{
      const y=50+i*44;
      const lo = i>=4, hi = i<=3;
      let active=false;
      if(f===0) active=true;
      if(f===1) active=lo;
      if(f===2) active=(i===3);
      if(f===3) active=hi;
      g.append('rect').attr('x',140).attr('y',y).attr('width',420).attr('height',38).attr('rx',7)
        .attr('fill','var(--bg-panel)').attr('stroke',l.c).attr('stroke-width',active?3:1.2).attr('opacity',active?1:0.7);
      if(active) g.append('rect').attr('x',140).attr('y',y).attr('width',420).attr('height',38).attr('rx',7).attr('fill','none').attr('stroke',l.c).attr('stroke-width',3).classed('focus-pulse',true);
      g.append('text').attr('x',158).attr('y',y+24).attr('fill',l.c).attr('font-size',13.5).attr('font-weight','700').text(l.n);
      g.append('text').attr('x',300).attr('y',y+24).attr('fill','var(--text-muted)').attr('font-size',11).text(l.fn);
      g.append('text').attr('x',545).attr('y',y+24).attr('text-anchor','end').attr('fill','var(--highlight)').attr('font-size',12).attr('font-weight','700').text('PDU: '+l.pdu);
    });
    if(f===0){
      g.append('text').attr('x',650).attr('y',80).attr('fill','var(--success)').attr('font-size',12).attr('font-weight','700').text('↓ 通信子网（低三层）');
      g.append('text').attr('x',650).attr('y',230).attr('fill','var(--primary)').attr('font-size',12).attr('font-weight','700').text('↑ 资源子网（高三层）');
      g.append('text').attr('x',650).attr('y',170).attr('fill','var(--highlight)').attr('font-size',12).attr('font-weight','700').text('传输层：分界线');
    }
    if(f===2){
      g.append('text').attr('x',620).attr('y',200).attr('fill','var(--highlight)').attr('font-size',12.5).attr('font-weight','700').text('第一个端到端层次');
      g.append('text').attr('x',620).attr('y',222).attr('fill','var(--text-muted)').attr('font-size',11.5).text('');
    }
  }

  if(f===4){
    /* 封装流水 */
    const stages=[
      {t:'应用层数据', x:80,  w:160, c:'var(--primary)', h:'应用层'},
      {t:'+ TCP 首部', x:250, w:220, c:'var(--highlight)', h:'传输层'},
      {t:'+ IP 首部',  x:480, w:200, c:'var(--success)', h:'网络层'},
      {t:'+ 帧首尾',   x:690, w:150, c:'var(--swap)', h:'链路层'},
    ];
    stages.forEach((s2,i)=>{
      g.append('rect').attr('x',s2.x).attr('y',120).attr('width',s2.w).attr('height',70).attr('rx',8)
        .attr('fill','var(--bg-panel)').attr('stroke',s2.c).attr('stroke-width',2.5);
      g.append('text').attr('x',s2.x+s2.w/2).attr('y',150).attr('text-anchor','middle').attr('fill',s2.c).attr('font-size',12.5).attr('font-weight','700').text(s2.t);
      g.append('text').attr('x',s2.x+s2.w/2).attr('y',172).attr('text-anchor','middle').attr('fill','var(--text-muted)').attr('font-size',11).text(s2.h);
      if(i<3) g.append('path').attr('d',`M ${s2.x+s2.w+4} 155 L ${s2.x+s2.w+30} 155`).attr('stroke','var(--text-muted)').attr('stroke-width',2).attr('marker-end','url(#arr144)');
    });
    g.append('text').attr('x',450).attr('y',80).attr('text-anchor','middle').attr('fill','var(--text)').attr('font-size',13.5).text('');
    g.append('text').attr('x',450).attr('y',240).attr('text-anchor','middle').attr('fill','var(--primary-strong)').attr('font-size',13.5).attr('font-weight','700').text('数据每往下传一层，就被加上该层的 PCI（协议控制信息）');
    g.append('text').attr('x',450).attr('y',268).attr('text-anchor','middle').attr('fill','var(--text-muted)').attr('font-size',12).text('接收方再逐层拆掉头部（解封），还原出应用层数据');
    g.append('text').attr('x',450).attr('y',320).attr('text-anchor','middle').attr('fill','var(--highlight)').attr('font-size',13).attr('font-weight','700').text('注意：物理层把帧变成比特流发送，头部尾部都在比特之前就已封装好');
  }

  const defs = svg.append('defs');
  defs.append('marker').attr('id','arr144').attr('viewBox','0 0 10 10').attr('refX',9).attr('refY',5).attr('markerWidth',7).attr('markerHeight',7).attr('orient','auto-start-reverse')
    .append('path').attr('d','M 0 0 L 10 5 L 0 10 z').attr('fill','var(--text-muted)');

  document.getElementById('subtitle').textContent = step.desc;
}

function renderStep(i){ stepIdx = Math.max(0, Math.min(i, STEPS.length-1)); renderViz(); }
function stepNext(){ renderStep(stepIdx+1); }
function stepPrev(){ renderStep(stepIdx-1); }
function stopPlay(){ if(playTimer){clearInterval(playTimer);playTimer=null;} playing=false; document.getElementById('btn-play').textContent='▶ 播放'; }
function togglePlay(){ if(playing){stopPlay();return;} playing=true; document.getElementById('btn-play').textContent='⏸ 暂停'; playTimer=setInterval(()=>{ if(stepIdx>=STEPS.length-1){stopPlay();return;} stepNext(); },1900); }

function renderDerive(){
  const el=document.getElementById('derive-katex');
  el.innerHTML = window.COURSEWARE_DATA.derivation.map(l=>`<div class="katex-holder">$$${l}$$</div>`).join('');
  if(window.renderMathInElement) window.renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true}]});
  else if(window.katex){ el.innerHTML=''; window.COURSEWARE_DATA.derivation.forEach(l=>{const d=document.createElement('div');d.className='katex-holder';el.appendChild(d);window.katex.render(l,d,{displayMode:true});}); }
}
function renderContent(){
  const d=window.COURSEWARE_DATA;
  document.getElementById('exam-text').innerHTML=(d.exam_text||'')+`<p style="color:var(--success);margin-top:8px;">${d.exam_answer||''}</p>`;
  document.getElementById('pitfall-list').innerHTML=(d.pitfall_list||[]).map(x=>`<li>${x}</li>`).join('');
  document.getElementById('quiz-list').innerHTML=(d.quiz_list||[]).map((q,qi)=>`<div class="quiz-item"><p>${q.question}</p>${q.options.map((o,oi)=>`<span class="opt" data-correct="${oi===q.correct?1:0}">${o}</span>`).join('')}</div>`).join('');
  renderDerive();
}
function bindQuiz(){
  document.querySelectorAll('.quiz-item .opt').forEach(opt=>{
    opt.addEventListener('click',()=>{const sib=opt.parentElement.querySelectorAll('.opt');sib.forEach(s=>s.classList.remove('correct','wrong'));opt.dataset.correct==='1'?opt.classList.add('correct'):opt.classList.add('wrong');});
  });
}
async function loadSkill(){
  if(location.protocol==='file:') return; // 双击本地打开时没有服务端，跳过技巧拉取，避免控制台报错
  const id = (window.COURSEWARE_DATA && window.COURSEWARE_DATA.id) || '';
  if(!id) return;
  try{ const r=await fetch('/api/skills/'+id); if(!r.ok) return; const s=await r.json();
    if(s && s.skill_text){ document.getElementById('skill-section').style.display='block'; document.getElementById('skill-content').innerHTML=s.skill_text.split('\n').filter(x=>x.trim()).map(x=>'<div style="margin:6px 0;">🎯 '+x+'</div>').join(''); }
  }catch(e){}
}
function initTheme(){
  try{const s=localStorage.getItem('theme');if(s)document.documentElement.setAttribute('data-theme',s);}catch(e){}
  document.getElementById('theme-float-btn').textContent = document.documentElement.getAttribute('data-theme')==='light'?'☀️':'🌙';
}
document.getElementById('theme-float-btn').addEventListener('click',()=>{
  const c=document.documentElement.getAttribute('data-theme');const n=c==='light'?'dark':'light';
  document.documentElement.setAttribute('data-theme',n);try{localStorage.setItem('theme',n);}catch(e){}
  document.getElementById('theme-float-btn').textContent = n==='light'?'☀️':'🌙';
});
function init(){
  renderContent(); loadSkill(); bindQuiz(); renderStep(0);
  document.getElementById('btn-next').addEventListener('click',stepNext);
  document.getElementById('btn-prev').addEventListener('click',stepPrev);
  document.getElementById('btn-play').addEventListener('click',togglePlay);
  document.getElementById('btn-reset').addEventListener('click',()=>{stepIdx=0;stopPlay();renderStep(0);});
}
window.addEventListener('load',()=>{ initTheme(); if(window.gsap) gsap.from('.section',{opacity:0,y:20,duration:0.6,stagger:0.12,ease:'power2.out'}); init(); });
</script>
</body>
</html>
