<body>
<div class="page-wrap">
<header class="course-header"><h1>物理层设备（中继器、集线器）</h1><span class="badge">B级 · CN-151</span></header>

<section class="section" id="intuition-section">
<h2><span class="num">1</span>直觉引入</h2>
<div id="intuition-text"><p>信号在线路上跑会衰减、变形，跑太远就「听不清」了。<strong>中继器</strong>的使命就是「续命」：把衰减失真的数字信号<strong>再生</strong>（整形放大）后继续转发，两端只是两条链路（一个网段变两个）。中继器只有<strong>两个端口</strong>。</p>
<p><strong>集线器（Hub）</strong>可以理解成「多口中继器」：一个端口收到信号，会<strong>原样广播</strong>到其他所有端口。它工作在物理层，不认识 MAC 地址、不会寻址，所以连在 Hub 上的所有设备<strong>共享一个冲突域和带宽</strong>——同时只能有一对设备通信，否则冲突。Hub 早已被交换机淘汰。</p></div>
</section>

<section class="section" id="animation-section">
<h2><span class="num">2</span>核心动画</h2>
<div class="control-bar">
<button class="ctrl-btn primary" id="btn-play">▶ 播放</button>
<button class="ctrl-btn" id="btn-prev">⏮ 上一步</button>
<button class="ctrl-btn" id="btn-next">⏭ 下一步</button>
<button class="ctrl-btn" id="btn-reset">↺ 重置</button>
</div>

</section>

<div id="derive-katex"></div>
</section>

<div id="exam-text"></div>
</section>

</section>

</section>
</div>

<button class="theme-float" id="theme-float-btn">🌙</button>

<script>
window.COURSEWARE_DATA = {
  id: "CN-151",
  title: "物理层设备（中继器、集线器）",
  derivation: [
    "\\text{中继器}: \\; \\text{两个端口}, \\; \\text{功能是再生数字信号（整形放大）}, \\; \\text{延长传输距离}",
    "\\text{中继器两端}: \\; \\text{两个网段，仍是同一个冲突域}",
    "\\text{集线器 Hub}: \\; \\text{多端口}, \\; \\text{收到信号广播到所有其他端口}",
    "\\text{集线器所有端口}: \\; \\text{同一冲突域} + \\text{共享带宽} \\; (\\text{半双工，CSMA/CD})"
  ],
  exam_text: "<b>【2016 真题改编】</b>用 5 个集线器级联连接 6 台主机，整个网络有几个冲突域？",
  exam_answer: "答案：<b>只有 1 个冲突域</b>。集线器是物理层设备，不隔离冲突域——所有端口收到任一信号都广播出去，级联再多 Hub 也只是把同一个冲突域「摊大」。带宽被所有主机共享，任一台发送时其他都必须监听等待。若换成交换机，则每个端口一个冲突域（6 个）。",
  pitfall_list: [
    "中继器只「再生」信号，不识别帧也不纠错——噪声引起的错误会被原样放大转发。",
    "中继器/集线器都不能隔离冲突域；能隔离冲突域的是交换机（网桥），能隔离广播域的是路由器。",
    "5-4-3 规则：10Base2 以太网最多 5 个网段、4 个中继器/集线器、3 个网段可接主机——这是中继器数量的经典考点。"
  ],
  quiz_list: [
    { question: "中继器工作在 OSI 的哪一层？", options: ["物理层", "数据链路层", "网络层"], correct: 0 },
    { question: "多台主机通过集线器相连，冲突域个数是？", options: ["1 个", "每个端口一个", "每台主机一个"], correct: 0 },
    { question: "能隔离冲突域的设备是？", options: ["集线器", "交换机（网桥）", "中继器"], correct: 1 },
  ]
};

/* ===== CN-151 专属动画：中继器再生 + 集线器广播 ===== */
const STEPS = [
  { focus:0, desc:'信号衰减失真问题：为什么需要中继器' },
  { focus:1, desc:'中继器：两个端口，把失真信号整形放大再生后转发' },
  { focus:2, desc:'级联中继器扩展距离，但仍是同一个冲突域' },
  { focus:3, desc:'集线器：多端口「多口中继器」，信号广播到所有端口' },
  { focus:4, desc:'Hub vs 交换机：不隔离冲突域 vs 每端口一个冲突域' },
];

let stepIdx = 0, playing = false, playTimer = null;

function renderViz(){
  const svg = d3.select('#viz');
  svg.selectAll('*').remove();
  const W = 900, H = 400;
  svg.attr('viewBox', `0 0 ${W} ${H}`);
  const g = svg.append('g');
  const step = STEPS[stepIdx];
  const f = step.focus;

  g.append('text').attr('x', W/2).attr('y', 28).attr('text-anchor','middle')
    .attr('fill','var(--primary-strong)').attr('font-size',15).attr('font-weight','700')
    .text(['信号衰减','中继器再生','级联','集线器广播','Hub vs 交换机'][f]);

  if(f===0){
    g.append('rect').attr('x',60).attr('y',110).attr('width',780).attr('height',150).attr('rx',10).attr('fill','var(--bg-panel)').attr('stroke','var(--border)').attr('stroke-width',1.5);
    /* 原始方波 */
    let d1='M 80 150';
    for(let i=0;i<10;i++){ d1 += ' L '+(80+i*60)+' '+(i%2?200:150)+' L '+(80+(i+1)*60)+' '+(i%2?200:150); }
    g.append('path').attr('d',d1).attr('fill','none').attr('stroke','var(--success)').attr('stroke-width',2.5);
    g.append('text').attr('x',80).attr('y',135).attr('fill','var(--success)').attr('font-size',11.5).attr('font-weight','700').text('发送端：干净方波');
    /* 衰减波形 */
    let d2='M 80 260';
    for(let i=0;i<10;i++){
      const amp = 22*(1-i/11);
      d2 += ' L '+(80+i*60)+' '+(260+(i%2?-amp:amp))+' L '+(80+(i+1)*60)+' '+(260+(i%2?-amp:amp));
    }
    g.append('path').attr('d',d2).attr('fill','none').attr('stroke','var(--danger)').attr('stroke-width',2.5);
    g.append('text').attr('x',80).attr('y',300).attr('fill','var(--danger)').attr('font-size',11.5).attr('font-weight','700').text('经过长距离后：幅度衰减、边沿变钝');
    g.append('text').attr('x',450).attr('y',350).attr('text-anchor','middle').attr('fill','var(--text-muted)').attr('font-size',12.5).text('');
    g.append('text').attr('x',450).attr('y',352).attr('text-anchor','middle').attr('fill','var(--text-muted)').attr('font-size',12.5).text('数字信号衰减到「0/1 难分」时就会误码——需要中继器再生');
  }

  if(f===1){
    g.append('rect').attr('x',80).attr('y',150).attr('width',130).attr('height',60).attr('rx',8).attr('fill','var(--bg-panel)').attr('stroke','var(--primary)').attr('stroke-width',2);
    g.append('text').attr('x',145).attr('y',175).attr('text-anchor','middle').attr('fill','var(--text)').attr('font-size',13).attr('font-weight','700').text('主机 A');
    g.append('rect').attr('x',350).attr('y',150).attr('width',120).attr('height',60).attr('rx',8).attr('fill','var(--bg-panel)').attr('stroke','var(--highlight)').attr('stroke-width',2.5);
    g.append('text').attr('x',410).attr('y',175).attr('text-anchor','middle').attr('fill','var(--highlight)').attr('font-size',14).attr('font-weight','700').text('中继器');
    g.append('text').attr('x',410).attr('y',196).attr('text-anchor','middle').attr('fill','var(--text-muted)').attr('font-size',10).text('');
    g.append('text').attr('x',410).attr('y',198).attr('text-anchor','middle').attr('fill','var(--text-muted)').attr('font-size',10).text('2 端口');
    g.append('rect').attr('x',690).attr('y',150).attr('width',130).attr('height',60).attr('rx',8).attr('fill','var(--bg-panel)').attr('stroke','var(--success)').attr('stroke-width',2);
    g.append('text').attr('x',755).attr('y',175).attr('text-anchor','middle').attr('fill','var(--text)').attr('font-size',13).attr('font-weight','700').text('主机 B');
    g.append('path').attr('d','M 210 180 L 350 180').attr('stroke','var(--border)').attr('stroke-width',2).attr('marker-end','url(#arr151)');
    g.append('path').attr('d','M 470 180 L 690 180').attr('stroke','var(--border)').attr('stroke-width',2).attr('marker-end','url(#arr151)');
    /* 波形：左衰减，中再生，右干净 */
    let d1='M 220 230';
    for(let i=0;i<6;i++){ const amp=16*(1-i/7); d1 += ' L '+(220+i*22)+' '+(230+(i%2?-amp:amp))+' L '+(220+(i+1)*22)+' '+(230+(i%2?-amp:amp)); }
    g.append('path').attr('d',d1).attr('fill','none').attr('stroke','var(--danger)').attr('stroke-width',2);
    let d2='M 490 230';
    for(let i=0;i<8;i++){ d2 += ' L '+(490+i*25)+' '+(i%2?205:230)+' L '+(490+(i+1)*25)+' '+(i%2?205:230); }
    g.append('path').attr('d',d2).attr('fill','none').attr('stroke','var(--success)').attr('stroke-width',2);
    g.append('text').attr('x',450).attr('y',300).attr('text-anchor','middle').attr('fill','var(--text)').attr('font-size',13).attr('font-weight','700').text('衰减信号 →【中继器再生】→ 恢复标准方波');
    g.append('text').attr('x',450).attr('y',330).attr('text-anchor','middle').attr('fill','var(--text-muted)').attr('font-size',12).text('');
    g.append('text').attr('x',450).attr('y',332).attr('text-anchor','middle').attr('fill','var(--text-muted)').attr('font-size',12).text('中继器不认识数据内容，只负责「整形放大」——噪声错误也会被一起转发');
  }

  if(f===2){
    const devs=[{t:'主机 A',x:70},{t:'中继器 1',x:270,c:'var(--highlight)'},{t:'中继器 2',x:470,c:'var(--highlight)'},{t:'主机 B',x:670}];
    devs.forEach((d,i)=>{
      const c = d.c||'var(--primary)';
      g.append('rect').attr('x',d.x).attr('y',150).attr('width',140).attr('height',56).attr('rx',8).attr('fill','var(--bg-panel)').attr('stroke',c).attr('stroke-width',d.c?2.5:2);
      g.append('text').attr('x',d.x+70).attr('y',183).attr('text-anchor','middle').attr('fill','var(--text)').attr('font-size',13).attr('font-weight','700').text(d.t);
      if(i<3) g.append('path').attr('d',`M ${d.x+140} 178 L ${d.x+210} 178`).attr('stroke','var(--border)').attr('stroke-width',2).attr('marker-end','url(#arr151)');
    });
    g.append('text').attr('x',450).attr('y',250).attr('text-anchor','middle').attr('fill','var(--text)').attr('font-size',13).text('每加一个中继器，信号就再生一次，传输距离成倍延伸');
    g.append('text').attr('x',450).attr('y',280).attr('text-anchor','middle').attr('fill','var(--danger)').attr('font-size',12.5).attr('font-weight','700').text('但整条链路仍然是同一个冲突域——中继器不隔离冲突域');
  }

  if(f===3){
    /* 集线器：中心 + 4 台主机 */
    g.append('rect').attr('x',390).attr('y',170).attr('width',120).attr('height',64).attr('rx',10)
      .attr('fill','var(--bg-panel)').attr('stroke','var(--highlight)').attr('stroke-width',3);
    g.append('text').attr('x',450).attr('y',198).attr('text-anchor','middle').attr('fill','var(--highlight)').attr('font-size',15).attr('font-weight','700').text('集线器');
    g.append('text').attr('x',450).attr('y',222).attr('text-anchor','middle').attr('fill','var(--text-muted)').attr('font-size',10.5).text('');
    g.append('text').attr('x',450).attr('y',222).attr('text-anchor','middle').attr('fill','var(--text-muted)').attr('font-size',10.5).text('多端口 · 物理层');
    const hosts=[{t:'主机 A',x:100,y:80},{t:'主机 B',x:700,y:80},{t:'主机 C',x:100,y:300},{t:'主机 D',x:700,y:300}];
    hosts.forEach((h,i)=>{
      g.append('rect').attr('x',h.x).attr('y',h.y).attr('width',110).attr('height',46).attr('rx',8).attr('fill','var(--bg-panel)').attr('stroke','var(--primary)').attr('stroke-width',2);
      g.append('text').attr('x',h.x+55).attr('y',h.y+29).attr('text-anchor','middle').attr('fill','var(--text)').attr('font-size',12.5).attr('font-weight','700').text(h.t);
      g.append('line').attr('x1',h.x+55).attr('y1',h.y+46).attr('x2',450).attr('y2',202).attr('stroke','var(--border)').attr('stroke-width',1.5);
    });
    /* 广播波纹 */
    g.append('circle').attr('cx',450).attr('cy',202).attr('r',40).attr('fill','none').attr('stroke','var(--highlight)').attr('stroke-width',2).attr('opacity',0.8);
    g.append('circle').attr('cx',450).attr('cy',202).attr('r',70).attr('fill','none').attr('stroke','var(--highlight)').attr('stroke-width',1.5).attr('opacity',0.4);
    g.append('text').attr('x',450).attr('y',370).attr('text-anchor','middle').attr('fill','var(--highlight)').attr('font-size',13).attr('font-weight','700').text('一个端口收到信号 → 广播到所有其他端口（不认 MAC，不寻址）');
  }

  if(f===4){
    g.append('rect').attr('x',70).attr('y',60).attr('width',370).attr('height',250).attr('rx',12)
      .attr('fill','var(--bg-panel)').attr('stroke','var(--danger)').attr('stroke-width',2.5);
    g.append('text').attr('x',255).attr('y',100).attr('text-anchor','middle').attr('fill','var(--danger)').attr('font-size',17).attr('font-weight','700').text('集线器 Hub');
    g.append('text').attr('x',255).attr('y',140).attr('text-anchor','middle').attr('fill','var(--text)').attr('font-size',13).text('');
    g.append('text').attr('x',255).attr('y',140).attr('text-anchor','middle').attr('fill','var(--text)').attr('font-size',13).text('冲突域：1 个');
    g.append('text').attr('x',255).attr('y',168).attr('text-anchor','middle').attr('fill','var(--text)').attr('font-size',13).text('带宽：所有端口共享');
    g.append('text').attr('x',255).attr('y',196).attr('text-anchor','middle').attr('fill','var(--text)').attr('font-size',13).text('');
    g.append('text').attr('x',255).attr('y',196).attr('text-anchor','middle').attr('fill','var(--text)').attr('font-size',13).text('工作方式：广播转发');
    g.append('text').attr('x',255).attr('y',224).attr('text-anchor','middle').attr('fill','var(--text)').attr('font-size',13).text('半双工 + CSMA/CD');
    g.append('rect').attr('x',470).attr('y',60).attr('width',370).attr('height',250).attr('rx',12)
      .attr('fill','var(--bg-panel)').attr('stroke','var(--success)').attr('stroke-width',2.5);
    g.append('text').attr('x',655).attr('y',100).attr('text-anchor','middle').attr('fill','var(--success)').attr('font-size',17).attr('font-weight','700').text('交换机 Switch');
    g.append('text').attr('x',655).attr('y',140).attr('text-anchor','middle').attr('fill','var(--text)').attr('font-size',13).text('冲突域：每端口 1 个');
    g.append('text').attr('x',655).attr('y',168).attr('text-anchor','middle').attr('fill','var(--text)').attr('font-size',13).text('带宽：每端口独享');
    g.append('text').attr('x',655).attr('y',196).attr('text-anchor','middle').attr('fill','var(--text)').attr('font-size',13).text('');
    g.append('text').attr('x',655).attr('y',196).attr('text-anchor','middle').attr('fill','var(--text)').attr('font-size',13).text('工作方式：查 MAC 表定向转发');
    g.append('text').attr('x',655).attr('y',224).attr('text-anchor','middle').attr('fill','var(--text)').attr('font-size',13).text('全双工，无冲突');
    g.append('text').attr('x',450).attr('y',340).attr('text-anchor','middle').attr('fill','var(--highlight)').attr('font-size',13).attr('font-weight','700').text('结论：交换机（网桥）隔离冲突域，路由器隔离广播域——Hub 两者都不能');
  }

  const defs = svg.append('defs');
  defs.append('marker').attr('id','arr151').attr('viewBox','0 0 10 10').attr('refX',9).attr('refY',5).attr('markerWidth',7).attr('markerHeight',7).attr('orient','auto-start-reverse')
    .append('path').attr('d','M 0 0 L 10 5 L 0 10 z').attr('fill','var(--text-muted)');

  document.getElementById('subtitle').textContent = step.desc;
}

function renderStep(i){ stepIdx = Math.max(0, Math.min(i, STEPS.length-1)); renderViz(); }
function stepNext(){ renderStep(stepIdx+1); }
function stepPrev(){ renderStep(stepIdx-1); }
function stopPlay(){ if(playTimer){clearInterval(playTimer);playTimer=null;} playing=false; document.getElementById('btn-play').textContent='▶ 播放'; }
function togglePlay(){ if(playing){stopPlay();return;} playing=true; document.getElementById('btn-play').textContent='⏸ 暂停'; playTimer=setInterval(()=>{ if(stepIdx>=STEPS.length-1){stopPlay();return;} stepNext(); },1900); }

function renderDerive(){
  const el=document.getElementById('derive-katex');
  el.innerHTML = window.COURSEWARE_DATA.derivation.map(l=>`<div class="katex-holder">$$${l}$$</div>`).join('');
  if(window.renderMathInElement) window.renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true}]});
  else if(window.katex){ el.innerHTML=''; window.COURSEWARE_DATA.derivation.forEach(l=>{const d=document.createElement('div');d.className='katex-holder';el.appendChild(d);window.katex.render(l,d,{displayMode:true});}); }
}
function renderContent(){
  const d=window.COURSEWARE_DATA;
  document.getElementById('exam-text').innerHTML=(d.exam_text||'')+`<p style="color:var(--success);margin-top:8px;">${d.exam_answer||''}</p>`;
  document.getElementById('pitfall-list').innerHTML=(d.pitfall_list||[]).map(x=>`<li>${x}</li>`).join('');
  document.getElementById('quiz-list').innerHTML=(d.quiz_list||[]).map((q,qi)=>`<div class="quiz-item"><p>${q.question}</p>${q.options.map((o,oi)=>`<span class="opt" data-correct="${oi===q.correct?1:0}">${o}</span>`).join('')}</div>`).join('');
  renderDerive();
}
function bindQuiz(){
  document.querySelectorAll('.quiz-item .opt').forEach(opt=>{
    opt.addEventListener('click',()=>{const sib=opt.parentElement.querySelectorAll('.opt');sib.forEach(s=>s.classList.remove('correct','wrong'));opt.dataset.correct==='1'?opt.classList.add('correct'):opt.classList.add('wrong');});
  });
}
async function loadSkill(){
  if(location.protocol==='file:') return; // 双击本地打开时没有服务端，跳过技巧拉取，避免控制台报错
  const id = (window.COURSEWARE_DATA && window.COURSEWARE_DATA.id) || '';
  if(!id) return;
  try{ const r=await fetch('/api/skills/'+id); if(!r.ok) return; const s=await r.json();
    if(s && s.skill_text){ document.getElementById('skill-section').style.display='block'; document.getElementById('skill-content').innerHTML=s.skill_text.split('\n').filter(x=>x.trim()).map(x=>'<div style="margin:6px 0;">🎯 '+x+'</div>').join(''); }
  }catch(e){}
}
function initTheme(){
  try{const s=localStorage.getItem('theme');if(s)document.documentElement.setAttribute('data-theme',s);}catch(e){}
  document.getElementById('theme-float-btn').textContent = document.documentElement.getAttribute('data-theme')==='light'?'☀️':'🌙';
}
document.getElementById('theme-float-btn').addEventListener('click',()=>{
  const c=document.documentElement.getAttribute('data-theme');const n=c==='light'?'dark':'light';
  document.documentElement.setAttribute('data-theme',n);try{localStorage.setItem('theme',n);}catch(e){}
  document.getElementById('theme-float-btn').textContent = n==='light'?'☀️':'🌙';
});
function init(){
  renderContent(); loadSkill(); bindQuiz(); renderStep(0);
  document.getElementById('btn-next').addEventListener('click',stepNext);
  document.getElementById('btn-prev').addEventListener('click',stepPrev);
  document.getElementById('btn-play').addEventListener('click',togglePlay);
  document.getElementById('btn-reset').addEventListener('click',()=>{stepIdx=0;stopPlay();renderStep(0);});
}
window.addEventListener('load',()=>{ initTheme(); if(window.gsap) gsap.from('.section',{opacity:0,y:20,duration:0.6,stagger:0.12,ease:'power2.out'}); init(); });
</script>
</body>
