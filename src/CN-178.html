<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TCP 三次握手与四次挥手</title>
<link rel="stylesheet" href="libs/katex.min.css">
<script defer src="libs/katex.min.js"></script>
<script defer src="libs/auto-render.min.js"></script>

<style>
:root {
  --bg:#0f1420; --bg-panel:#161d2e; --bg-elevated:#1d263b; --border:#2a3550;
  --text:#e6ebf5; --text-muted:#8b96ad; --primary:#4f8cff; --primary-strong:#6ea8ff;
  --highlight:#ffb020; --success:#2dd4a7; --compare:#ff6b6b; --swap:#ff9f43; --danger:#ff5c7a;
  --dim-opacity:0.22; --radius:12px; --shadow:0 6px 24px rgba(0,0,0,0.35);
  --font:"PingFang SC","Microsoft YaHei",-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono","SFMono-Regular",Consolas,monospace;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:var(--font); background:var(--bg); color:var(--text); line-height:1.65; -webkit-font-smoothing:antialiased; }
.page-wrap { max-width:1280px; margin:0 auto; padding:24px; }
header.course-header { display:flex; align-items:center; justify-content:space-between; padding:16px 24px; background:var(--bg-panel); border:1px solid var(--border); border-radius:var(--radius); margin-bottom:24px; }
.course-header h1 { font-size:22px; font-weight:700; }
.course-header .badge { font-size:12px; color:var(--primary-strong); border:1px solid var(--primary); padding:2px 10px; border-radius:999px; }
.section { background:var(--bg-panel); border:1px solid var(--border); border-radius:var(--radius); padding:24px; margin-bottom:24px; box-shadow:var(--shadow); }
.section h2 { font-size:18px; margin-bottom:16px; display:flex; align-items:center; gap:8px; }
.section h2 .num { width:26px; height:26px; border-radius:8px; background:var(--primary); color:#fff; display:inline-flex; align-items:center; justify-content:center; font-size:14px; font-weight:700; }
.dimmed { opacity:var(--dim-opacity); filter:grayscale(0.6); transition:all .4s ease; }
.control-bar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:12px 16px; background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius); margin-bottom:16px; position:sticky; top:12px; z-index:10; }
.ctrl-btn { font-family:var(--font); font-size:14px; font-weight:600; color:var(--text); background:var(--bg-panel); border:1px solid var(--border); border-radius:8px; padding:8px 16px; cursor:pointer; transition:all .15s ease; }
.ctrl-btn:hover { border-color:var(--primary); color:var(--primary-strong); transform:translateY(-1px); }
.ctrl-btn.primary { background:var(--primary); color:#fff; border-color:var(--primary); }
.ctrl-btn:active { transform:translateY(0); }
.speed-label { font-size:13px; color:var(--text-muted); margin-left:8px; }
input[type="range"] { accent-color:var(--primary); }
/* 时序图舞台 */
.stage { display:grid; grid-template-columns:1.4fr 1fr; gap:24px; min-height:440px; }
.viz-panel { background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius); padding:16px; position:relative; overflow:hidden; }
.viz-panel svg { width:100%; height:100%; }
.state-panel { background:#0b0f18; border:1px solid var(--border); border-radius:var(--radius); padding:16px; font-family:var(--mono); font-size:13px; }
.state-panel .state-line { padding:6px 10px; border-radius:6px; transition:all .3s; }
.state-panel .state-line.active { background:rgba(79,140,255,0.22); color:var(--primary-strong); }
.state-badge { display:inline-block; font-size:11px; padding:1px 8px; border-radius:999px; margin-left:8px; }
.s-CLOSED { background:rgba(139,150,173,0.2); color:#8b96ad; }
.s-LISTEN { background:rgba(79,140,255,0.2); color:#6ea8ff; }
.s-SYN-SENT { background:rgba(255,159,67,0.2); color:#ff9f43; }
.s-SYN-RCVD { background:rgba(255,176,32,0.2); color:#ffb020; }
.s-ESTABLISHED { background:rgba(45,212,167,0.2); color:#2dd4a7; }
.s-FIN-WAIT { background:rgba(255,107,107,0.2); color:#ff6b6b; }
.s-CLOSE-WAIT { background:rgba(255,107,107,0.2); color:#ff6b6b; }
.subtitle-bar { position:absolute; bottom:12px; left:50%; transform:translateX(-50%); background:var(--bg-elevated); border:1px solid var(--highlight); color:var(--highlight); padding:6px 16px; border-radius:999px; font-size:14px; font-weight:600; white-space:nowrap; }
.pitfall-list { padding-left:16px; } .pitfall-list li { margin-bottom:8px; } .pitfall-list li::marker { color:var(--danger); }
.quiz-item { margin-bottom:16px; }
.quiz-item .opt { display:block; padding:8px 14px; margin-top:6px; background:var(--bg-elevated); border:1px solid var(--border); border-radius:8px; cursor:pointer; transition:all .15s; }
.quiz-item .opt:hover { border-color:var(--primary); }
.quiz-item .opt.correct { border-color:var(--success); color:var(--success); }
.quiz-item .opt.wrong { border-color:var(--danger); color:var(--danger); }
.katex-holder { margin:6px 0; }

[data-theme="light"] {
  --bg:#f5f7fa; --bg-panel:#ffffff; --bg-elevated:#f0f3f8; --border:#dde3ec;
  --text:#1a2333; --text-muted:#6b7688; --primary:#3b82f6; --primary-strong:#2563eb;
  --highlight:#f59e0b; --success:#10b981; --compare:#ef4444; --swap:#f97316; --danger:#ef4444;
  --shadow:0 4px 16px rgba(0,0,0,0.08);
}
/* 响应式：平板/手机自适应堆叠 */
.theme-float { position:fixed; top:14px; right:14px; z-index:9999; font-size:20px; background:var(--bg-panel); border:1px solid var(--border); border-radius:10px; padding:6px 12px; cursor:pointer; box-shadow:var(--shadow); }
@media (max-width:768px) {
  .stage, .page-wrap { grid-template-columns:1fr !important; }
  .stage { display:block !important; }
  .stage > * { margin-bottom:16px; }
  .control-bar { position:static !important; }
}
@media (max-width:375px) {
  .course-header h1 { font-size:18px !important; }
  .section { padding:16px !important; }
}

/* ===== 移动端适配补丁（统一追加：公式可横向滚动、标题栏可换行、字幕可换行） ===== */
.katex-holder{overflow-x:auto;overflow-y:hidden}
.katex-display{margin:0.4em 0}
header.course-header{flex-wrap:wrap;gap:8px}
header.course-header h1{min-width:0;word-break:break-word}
@media(max-width:768px){
  .page-wrap{padding:12px}
  .section{padding:16px}
  .control-bar{position:static;gap:6px;padding:10px 12px}
  .ctrl-btn{padding:7px 12px;font-size:13px}
  .subtitle-bar{white-space:normal;max-width:94%;line-height:1.35;font-size:12.5px;text-align:center}
  header.course-header h1{font-size:18px}
}
</style>
</head>
<body>
<div class="page-wrap">
  <header class="course-header">
    <h1 id="course-title">TCP 三次握手与四次挥手</h1>
    <span class="badge">CN-178 · 传输层 · 408</span>
  </header>

  <section class="section" id="intuition-section">
    <h2><span class="num">1</span>直觉引入</h2>
    <div id="intuition-text"><p>打电话之前，双方要先「喂喂喂」确认能听见——TCP 建立连接也一样。客户端发 <b>SYN</b>（我想连接），服务端回 <b>SYN+ACK</b>（收到，我也准备好了），客户端再回 <b>ACK</b>（好，开始吧）。三次「打招呼」之后，双方才放心传输数据。</p></div>
  </section>

  <section class="section" id="animation-section">
    <h2><span class="num">2</span>核心动画</h2>
    <div class="control-bar">
      <button class="ctrl-btn primary" id="btn-play">▶ 播放</button>
      <button class="ctrl-btn" id="btn-prev">⏮ 上一步</button>
      <button class="ctrl-btn" id="btn-next">⏭ 下一步</button>
      <button class="ctrl-btn" id="btn-reset">↺ 重置</button>
      <span class="speed-label">速度 <input type="range" id="speed" min="0.5" max="3" step="0.5" value="1"></span>
      <span class="speed-label">阶段
        <button class="ctrl-btn" id="btn-mode" style="font-size:12px;padding:4px 12px;">握手 ⇄ 挥手</button>
      </span>
    </div>
    <div class="stage">
      <div class="viz-panel" id="viz-panel">
        <svg id="viz"></svg>
        <div class="subtitle-bar" id="subtitle">初始状态</div>
      </div>
      <div class="state-panel" id="state-panel"></div>
    </div>
  </section>

  <section class="section" id="derive-section">
    <h2><span class="num">3</span>公式推导</h2>
    <div id="derive-katex"></div>
  </section>

  <section class="section" id="exam-section">
    <h2><span class="num">4</span>历年真题实战</h2>
    <div id="exam-text"></div>
  </section>

  <section class="section" id="skill-section" style="display:none;">
    <h2><span class="num">💡</span>做题技巧</h2>
    <div id="skill-content" style="line-height:1.9;"></div>
  </section>
  <section class="section" id="pitfall-section">
    <h2><span class="num">5</span>易错点</h2>
    <ul class="pitfall-list" id="pitfall-list"></ul>
  </section>

  <section class="section" id="quiz-section">
    <h2><span class="num">6</span>自测</h2>
    <div id="quiz-list"></div>
  </section>
</div>

<script>
/* ==================== 内联数据（双击即用） ==================== */
window.COURSEWARE_DATA = {
  id: "CN-178",
  title: "TCP 三次握手与四次挥手",
  intuition_text: "打电话之前，双方要先「喂喂喂」确认能听见——TCP 建立连接也一样。客户端发 <b>SYN</b>（我想连接），服务端回 <b>SYN+ACK</b>（收到，我也准备好了），客户端再回 <b>ACK</b>（好，开始吧）。三次「打招呼」之后，双方才放心传输数据。",
  derivation: [
    "\\text{三次握手：} \\text{CLIENT}\\xrightarrow{SYN}\\text{SERVER}",
    "\\text{SERVER}\\xrightarrow{SYN+ACK}\\text{CLIENT}",
    "\\text{CLIENT}\\xrightarrow{ACK}\\text{SERVER}",
    "\\Rightarrow \\text{双方进入 } \\text{ESTABLISHED}"
  ],
  exam_text: "<b>【真题·典型】</b>TCP 三次握手中，若第三次握手（客户端发送 ACK）丢失，客户端和服务端此时分别处于什么状态？",
  exam_answer: "答案：客户端已进入 ESTABLISHED（发出 ACK 后即认为连接建立）；服务端仍停留在 SYN-RCVD（未收到 ACK，会重传 SYN+ACK，直到超时）。这正说明「第三次握手」是为防止已失效的连接请求报文突然又传到服务端。",
  pitfall_list: [
    "三次握手不是「客户端发3次、服务端发3次」，而是双方合计 3 个报文：SYN → SYN+ACK → ACK。",
    "第二次握手 SYN+ACK 是「一个报文同时携带 SYN 和 ACK 标志位」，不是两个报文。",
    "第三次握手丢失时：客户端已 ESTABLISHED，服务端仍 SYN-RCVD（会重传），这是高频易错点。",
    "四次挥手中，被动关闭方收到 FIN 后进入 CLOSE-WAIT，此时可能还有数据要发，不会立刻发 FIN。"
  ],
  quiz_list: [
    { question: "TCP 建立连接需要几次握手？", options: ["2 次", "3 次", "4 次"], correct: 1 },
    { question: "第二次握手报文中包含哪些标志位？", options: ["仅 SYN", "SYN + ACK", "仅 ACK"], correct: 1 },
    { question: "第三次握手（ACK）丢失后，服务端处于什么状态？", options: ["ESTABLISHED", "SYN-RCVD", "CLOSED"], correct: 1 }
  ]
};

/* ==================== 专属动画逻辑：TCP 时序图 ==================== */
const MODE = { HANDSHAKE: '握手', WAVE: '挥手' };
let currentMode = MODE.HANDSHAKE;

// 三次握手步骤（每步：发送方、接收方、报文、标志、发送方新状态、接收方新状态）
const HANDSHAKE_STEPS = [
  { from:'C', to:'S', pkt:'SYN', flags:'SYN', seq:'seq=x', cState:'SYN-SENT', sState:'LISTEN', sub:'第1次：客户端发 SYN，进入 SYN-SENT' },
  { from:'S', to:'C', pkt:'SYN+ACK', flags:'SYN,ACK', seq:'seq=y, ack=x+1', cState:'SYN-SENT', sState:'SYN-RCVD', sub:'第2次：服务端回 SYN+ACK，进入 SYN-RCVD' },
  { from:'C', to:'S', pkt:'ACK', flags:'ACK', seq:'seq=x+1, ack=y+1', cState:'ESTABLISHED', sState:'SYN-RCVD', sub:'第3次：客户端回 ACK，进入 ESTABLISHED' },
  { from:'C', to:'S', pkt:'', flags:'', seq:'', cState:'ESTABLISHED', sState:'ESTABLISHED', sub:'服务端收到 ACK，也进入 ESTABLISHED，连接建立 ✓' },
];

// 四次挥手步骤
const WAVE_STEPS = [
  { from:'C', to:'S', pkt:'FIN', flags:'FIN', seq:'seq=u', cState:'FIN-WAIT-1', sState:'ESTABLISHED', sub:'第1次：主动方发 FIN，进入 FIN-WAIT-1' },
  { from:'S', to:'C', pkt:'ACK', flags:'ACK', seq:'ack=u+1', cState:'FIN-WAIT-2', sState:'CLOSE-WAIT', sub:'第2次：被动方回 ACK，进入 CLOSE-WAIT；主动方 FIN-WAIT-2' },
  { from:'S', to:'C', pkt:'FIN', flags:'FIN', seq:'seq=w', cState:'FIN-WAIT-2', sState:'LAST-ACK', sub:'第3次：被动方发 FIN，进入 LAST-ACK' },
  { from:'C', to:'S', pkt:'ACK', flags:'ACK', seq:'ack=w+1', cState:'TIME-WAIT', sState:'CLOSED', sub:'第4次：主动方回 ACK，进入 TIME-WAIT；被动方 CLOSED' },
];

let steps = HANDSHAKE_STEPS;
let stepIdx = 0;
let playing = false, playTimer = null, speed = 1;

function renderStatePanel() {
  const panel = document.getElementById('state-panel');
  const step = steps[stepIdx];
  const cState = step ? step.cState : 'CLOSED';
  const sState = step ? step.sState : 'LISTEN';
  const cActive = step && step.from === 'C';
  const sActive = step && step.from === 'S';
  panel.innerHTML = `
    <div style="margin-bottom:12px;font-weight:700;color:var(--highlight);">连接状态</div>
    <div class="state-line ${cActive?'active':''}" id="state-c">
      客户端 Client
      <span class="state-badge s-${cState}">${cState}</span>
    </div>
    <div class="state-line ${sActive?'active':''}" id="state-s">
      服务端 Server
      <span class="state-badge s-${sState}">${sState}</span>
    </div>
  `;
}

function renderViz() {
  const svg = d3.select('#viz');
  svg.selectAll('*').remove();
  const W = 560, H = 420;
  svg.attr('viewBox', `0 0 ${W} ${H}`);

  // 两条生命线
  const cX = 120, sX = W - 120;
  const g = svg.append('g');

  // 客户端生命线
  g.append('line').attr('x1',cX).attr('y1',40).attr('x2',cX).attr('y2',H-40)
    .attr('stroke','var(--primary)').attr('stroke-width',3);
  g.append('rect').attr('x',cX-38).attr('y',12).attr('width',76).attr('height',30).attr('rx',8)
    .attr('fill','var(--primary)').attr('opacity',0.2);
  g.append('text').attr('x',cX).attr('y',32).attr('text-anchor','middle').attr('fill','#fff').attr('font-size',13).text('客户端');

  // 服务端生命线
  g.append('line').attr('x1',sX).attr('y1',40).attr('x2',sX).attr('y2',H-40)
    .attr('stroke','var(--success)').attr('stroke-width',3);
  g.append('rect').attr('x',sX-38).attr('y',12).attr('width',76).attr('height',30).attr('rx',8)
    .attr('fill','var(--success)').attr('opacity',0.2);
  g.append('text').attr('x',sX).attr('y',32).attr('text-anchor','middle').attr('fill','#fff').attr('font-size',13).text('服务端');

  // 已发生的报文（残影，半透明）
  for (let i = 0; i < stepIdx; i++) {
    drawArrow(svg, steps[i], i, 0.35);
  }
  // 当前报文（高亮，呼吸）
  if (stepIdx < steps.length) {
    drawArrow(svg, steps[stepIdx], stepIdx, 1.0, true);
  }
}

function drawArrow(svg, step, idx, opacity, isCurrent) {
  const W = 560, H = 420;
  const cX = 120, sX = W - 120;
  const y = 80 + idx * (currentMode===MODE.HANDSHAKE ? 80 : 70);
  const fromX = step.from === 'C' ? cX : sX;
  const toX = step.from === 'C' ? sX : cX;
  const color = isCurrent ? 'var(--highlight)' : (step.from==='C' ? 'var(--primary)' : 'var(--success)');

  const g = d3.select('#viz').append('g').attr('opacity', opacity);

  // 箭头线
  g.append('line').attr('x1',fromX).attr('y1',y).attr('x2',toX).attr('y2',y)
    .attr('stroke',color).attr('stroke-width',isCurrent?3.5:2.5)
    .attr('marker-end', `url(#arrow-${step.from})`);
  // 报文标签
  const mx = (fromX + toX) / 2;
  g.append('rect').attr('x',mx-52).attr('y',y-16).attr('width',104).attr('height',22).attr('rx',6)
    .attr('fill', color).attr('opacity',0.25);
  g.append('text').attr('x',mx).attr('y',y).attr('text-anchor','middle')
    .attr('fill', color).attr('font-size',14).attr('font-weight','700')
    .text(step.pkt || '');
  if (step.seq) {
    g.append('text').attr('x',mx).attr('y',y+18).attr('text-anchor','middle')
      .attr('fill','var(--text-muted)').attr('font-size',11).text(step.seq);
  }

  // 定义箭头标记
  const defs = d3.select('#viz').select('defs');
  if (defs.empty()) d3.select('#viz').append('defs');
  const markerId = `arrow-${step.from}`;
  if (d3.select('#viz').select(`#${markerId}`).empty()) {
    d3.select('#viz defs').append('marker')
      .attr('id', markerId).attr('viewBox','0 0 10 10')
      .attr('refX','9').attr('refY','5').attr('markerWidth','6').attr('markerHeight','6')
      .attr('orient','auto')
      .append('path').attr('d','M0,0 L10,5 L0,10 Z').attr('fill',color);
  }
}

// 数据包飞行动画（GSAP）
function animatePacket() {
  if (!window.gsap || stepIdx >= steps.length) return;
  const step = steps[stepIdx];
  const W = 560, H = 420;
  const cX = 120, sX = W - 120;
  const idx = stepIdx;
  const y = 80 + idx * (currentMode===MODE.HANDSHAKE ? 80 : 70);
  const fromX = step.from === 'C' ? cX : sX;
  const toX = step.from === 'C' ? sX : cX;

  // 创建一个飞行的数据包圆点
  const flyer = d3.select('#viz').append('circle')
    .attr('cx', fromX).attr('cy', y).attr('r', 8)
    .attr('fill', 'var(--highlight)').attr('class','flyer');

  gsap.to(flyer.node(), {
    attr: { cx: toX }, duration: 0.8, ease: 'power2.inOut',
    onComplete: () => { flyer.remove(); }
  });
}

function renderStep(idx) {
  stepIdx = Math.max(0, Math.min(idx, steps.length - 1));
  renderViz();
  renderStatePanel();
  const sub = document.getElementById('subtitle');
  sub.textContent = steps[stepIdx] ? steps[stepIdx].sub : '完成';
  // 数据包飞行动画
  if (steps[stepIdx] && steps[stepIdx].pkt) animatePacket();
}

function switchMode(mode) {
  currentMode = mode;
  steps = mode === MODE.HANDSHAKE ? HANDSHAKE_STEPS : WAVE_STEPS;
  stepIdx = 0;
  stopPlay();
  renderStep(0);
  document.getElementById('btn-mode').textContent = mode === MODE.HANDSHAKE ? '握手 ⇄ 挥手' : '挥手 ⇄ 握手';
}

function stepNext() { renderStep(stepIdx + 1); }
function stepPrev() { renderStep(stepIdx - 1); }
function stopPlay() { if (playTimer) { clearInterval(playTimer); playTimer=null; } playing=false; document.getElementById('btn-play').textContent='▶ 播放'; }
function togglePlay() {
  if (playing) { stopPlay(); return; }
  playing = true;
  document.getElementById('btn-play').textContent = '⏸ 暂停';
  playTimer = setInterval(() => {
    if (stepIdx >= steps.length - 1) { stopPlay(); return; }
    stepNext();
  }, 1200 / speed);
}

function renderDerive() {
  const el = document.getElementById('derive-katex');
  const lines = window.COURSEWARE_DATA.derivation;
  el.innerHTML = lines.map(l => `<div class="katex-holder">$$${l}$$</div>`).join('');
  if (window.renderMathInElement) window.renderMathInElement(el, { delimiters:[{left:'$$',right:'$$',display:true}] });
  else if (window.katex) { el.innerHTML=''; lines.forEach(l=>{ const d=document.createElement('div'); d.className='katex-holder'; el.appendChild(d); window.katex.render(l,d,{displayMode:true}); }); }
}
function renderContent() {
  const d = window.COURSEWARE_DATA;
  document.getElementById('course-title').textContent = d.title;
  document.getElementById('intuition-text').innerHTML = `<p>${d.intuition_text}</p>`;
  document.getElementById('exam-text').innerHTML = d.exam_text + `<p id="exam-answer" style="color:var(--success);margin-top:8px;">${d.exam_answer}</p>`;
  document.getElementById('pitfall-list').innerHTML = d.pitfall_list.map(x=>`<li>${x}</li>`).join('');
  document.getElementById('quiz-list').innerHTML = d.quiz_list.map((q,qi)=>`<div class="quiz-item"><p>${q.question}</p>${q.options.map((o,oi)=>`<span class="opt" data-correct="${oi===q.correct?1:0}">${o}</span>`).join('')}</div>`).join('');
  renderDerive();
}
function bindQuiz() {
  document.querySelectorAll('.quiz-item .opt').forEach(opt => {
    opt.addEventListener('click', () => {
      const sib = opt.parentElement.querySelectorAll('.opt');
      sib.forEach(s=>s.classList.remove('correct','wrong'));
      opt.dataset.correct==='1' ? opt.classList.add('correct') : opt.classList.add('wrong');
    });
  });
}


async function loadSkill(){
  if(location.protocol==='file:') return; // 双击本地打开时没有服务端，跳过技巧拉取，避免控制台报错
  const id = (typeof DATA !== 'undefined' && DATA && DATA.id) || (window.COURSEWARE_DATA && window.COURSEWARE_DATA.id) || '';
  if (!id) return;
  try {
    const r = await fetch('/api/skills/' + id);
    if (!r.ok) return;
    const s = await r.json();
    if (s && s.skill_text) {
      document.getElementById('skill-section').style.display = 'block';
      document.getElementById('skill-content').innerHTML = s.skill_text
        .split('\n').filter(x => x.trim())
        .map(x => '<div style="margin:6px 0;">🎯 ' + x + '</div>').join('');
    }
  } catch(e) {}
}

function init() {
  renderContent();
  loadSkill();
  bindQuiz();
  renderStep(0);
  document.getElementById('btn-next').addEventListener('click', stepNext);
  document.getElementById('btn-prev').addEventListener('click', stepPrev);
  document.getElementById('btn-play').addEventListener('click', togglePlay);
  document.getElementById('btn-reset').addEventListener('click', ()=>{ stepIdx=0; stopPlay(); renderStep(0); });
  document.getElementById('btn-mode').addEventListener('click', ()=>{ switchMode(currentMode===MODE.HANDSHAKE?MODE.WAVE:MODE.HANDSHAKE); });
  document.getElementById('speed').addEventListener('input', e=>{ speed=+e.target.value; });
}
window.addEventListener('load', ()=>{
  if (window.gsap) gsap.from('.section', { opacity:0, y:20, duration:0.6, stagger:0.12, ease:'power2.out' });
  init();
});
</script>

<button class="theme-float" id="theme-float-btn" title="切换主题">🌙</button>
<script>
(function(){
  var btn = document.getElementById('theme-float-btn');
  try { var s = localStorage.getItem('theme'); if(s) document.documentElement.setAttribute('data-theme', s); } catch(e){}
  function upd(){ var d = document.documentElement.getAttribute('data-theme')!=='light'; btn.textContent = d?'🌙':'☀️'; }
  upd();
  btn.addEventListener('click', function(){
    var c = document.documentElement.getAttribute('data-theme');
    var n = c==='light'?'dark':'light';
    document.documentElement.setAttribute('data-theme', n);
    try { localStorage.setItem('theme', n); } catch(e){}
    upd();
  });
})();
</script>
