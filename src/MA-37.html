<div id="intuition-text">多元函数有多个变量。偏导数就是「固定其他变量，只对一个变量求导」。几何上，∂f/∂x 是曲面沿 x 方向的切线斜率（y 固定不变），∂f/∂y 是沿 y 方向的切线斜率（x 固定）。</div>

<script>
window.COURSEWARE_DATA = {
  id: "MA-37",
  title: "偏导数的概念与计算",
  derivation: ["\\frac{\\partial f}{\\partial x} = \\lim_{\\Delta x\\to0} \\frac{f(x+\\Delta x,y)-f(x,y)}{\\Delta x}","\\text{求 } f_x：\\text{把 y 当常数，对 x 求导}","\\text{求 } f_y：\\text{把 x 当常数，对 y 求导}"],
  exam_text: "<b>【真题】</b>f=x²+y² 的偏导数 ∂f/∂x 和 ∂f/∂y 分别是？",
  exam_answer: "答案：∂f/∂x=2x，∂f/∂y=2y。求 ∂f/∂x 时 y 当常数，求 ∂f/∂y 时 x 当常数。",
  pitfall_list: ["求 ∂f/∂x 时把 y 当常数（不是 0），这是最常见的错。","偏导数存在不代表函数连续（比一元函数更弱）。","偏导数是「沿坐标轴方向」的变化率，是方向导数的特例。"],
  quiz_list: [{"question":"f=x²+y² 的 ∂f/∂x 是？","options":["2x","2y","x²","y²"],"correct":0},{"question":"求 ∂f/∂x 时，y 怎么处理？","options":["当常数","当0","当变量","忽略"],"correct":0}],
  intuition_text: "多元函数有多个变量。偏导数就是「固定其他变量，只对一个变量求导」。几何上，∂f/∂x 是曲面沿 x 方向的切线斜率（y 固定不变），∂f/∂y 是沿 y 方向的切线斜率（x 固定）。"
};

/* ===== MA-37 专属动画：偏导数的概念与计算 ===== */
const STEPS = [{"focus":0,"desc":"二元函数 z=f(x,y) 是一张曲面 —— 平面上有无数个方向，怎么定义「导数」？"},{"focus":1,"desc":"先只沿 x 方向动：用平面 y=y₀ 把曲面切一刀，得到一条截线"},{"focus":2,"desc":"问题降为一元：在这条截线上，z 只随 x 变化"},{"focus":3,"desc":"截线在 x₀ 处的切线斜率，就是对 x 的偏导数 ∂f/∂x（把 y 视为常数）"},{"focus":4,"desc":"换方向：用平面 x=x₀ 再切一刀，得到 ∂f/∂y（把 x 视为常数）"},{"focus":5,"desc":"计算法则：求 fₓ 时把 y 当常数，求 f_y 时把 x 当常数，其余照常求导"}];

let stepIdx = 0, playing = false, playTimer = null;

/* —— 通用几何工具（仅坐标/样式辅助，每个知识点的动画编排均为独立手写） —— */
function box(g,x,y,w,h,stroke,fillOp,rx){
  g.append('rect').attr('x',x).attr('y',y).attr('width',w).attr('height',h).attr('rx',rx===undefined?8:rx)
    .attr('fill',stroke).attr('fill-opacity',fillOp===undefined?0.1:fillOp).attr('stroke',stroke).attr('stroke-width',2);
}
function txt(g,x,y,s,fill,size,anchor,weight){
  g.append('text').attr('x',x).attr('y',y).attr('text-anchor',anchor||'middle')
    .attr('fill',fill||'var(--text)').attr('font-size',size||13).attr('font-weight',weight||400).text(s);
}
function ln(g,x1,y1,x2,y2,stroke,sw,dash){
  g.append('line').attr('x1',x1).attr('y1',y1).attr('x2',x2).attr('y2',y2)
    .attr('stroke',stroke).attr('stroke-width',sw||1.6).attr('stroke-dasharray',dash||'');
}
function arw(g,x1,y1,x2,y2,color,dash){
  g.append('line').attr('x1',x1).attr('y1',y1).attr('x2',x2).attr('y2',y2)
    .attr('stroke',color).attr('stroke-width',2).attr('stroke-dasharray',dash||'').attr('marker-end','url(#arwGen)');
}
function circ(g,cx,cy,r,fill,stroke,sw){
  g.append('circle').attr('cx',cx).attr('cy',cy).attr('r',r).attr('fill',fill)
    .attr('stroke',stroke||'none').attr('stroke-width',sw||0);
}
function chip(g,x,y,w,h,label,color,sub){
  box(g,x,y,w,h,color,0.14);
  txt(g,x+w/2,y+(sub?h/2-4:h/2+5),label,color,13,'middle','700');
  if(sub) txt(g,x+w/2,y+h/2+14,sub,'var(--text-muted)',10.5);
}
function title(g,s){
  txt(g,450,28,s,'var(--primary-strong)',15,'middle','700');
}
function plot(g,f,x0,y0,w,h,color,sw){
  let d='';
  for(let i=0;i<=100;i++){
    const t=i/100, x=x0+w*t, y=y0-h*f(t);
    d+=(i?' L ':'M ')+x.toFixed(1)+' '+y.toFixed(1);
  }
  g.append('path').attr('d',d).attr('fill','none').attr('stroke',color).attr('stroke-width',sw||2.2);
}

function renderViz(){
  const svg = d3.select('#viz');
  svg.selectAll('*').remove();
  const W = 900, H = 400;
  svg.attr('viewBox', '0 0 ' + W + ' ' + H);
  const g = svg.append('g');
  const step = STEPS[stepIdx];
  const f = step.focus;
  const defs = svg.append('defs');
  defs.append('marker').attr('id','arwGen').attr('viewBox','0 0 10 10').attr('refX',9).attr('refY',5)
    .attr('markerWidth',7).attr('markerHeight',7).attr('orient','auto-start-reverse')
    .append('path').attr('d','M 0 0 L 10 5 L 0 10 z').attr('fill','var(--primary-strong)');
  
    const C = ['var(--primary)', 'var(--success)', 'var(--highlight)', 'var(--danger)'];
    const head = ['曲面 z = f(x, y)', '用平面 y = y₀ 切一刀', '截线：z 只随 x 变化', '切线斜率 = ∂f/∂x', '另一方向：∂f/∂y', '计算：另一个变量当常数'];
    title(g, head[f]);

    function P(x, y, z) { return [330 + (x - y) * 86, 228 + (x + y) * 37 - z * 44]; }
    function fz(x, y) { return 0.8 * (x * x - y * y); }
    function seg(a, b, color, w, dash, op) {
      g.append('line').attr('x1', a[0]).attr('y1', a[1]).attr('x2', b[0]).attr('y2', b[1])
        .attr('stroke', color).attr('stroke-width', w || 1.2).attr('stroke-dasharray', dash || '').attr('opacity', op === undefined ? 1 : op);
    }
    function curve(pts, color, w, dash) {
      let d = '';
      pts.forEach(function (p, i) { d += (i ? ' L ' : 'M ') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); });
      g.append('path').attr('d', d).attr('fill', 'none').attr('stroke', color).attr('stroke-width', w || 2.2).attr('stroke-dasharray', dash || '');
    }

    // 曲面网格
    const N = 10;
    for (let i = 0; i <= N; i++) {
      const t = -1 + 2 * i / N;
      const pts1 = [], pts2 = [];
      for (let j = 0; j <= 16; j++) {
        const s = -1 + 2 * j / 16;
        pts1.push(P(t, s, fz(t, s)));
        pts2.push(P(s, t, fz(s, t)));
      }
      curve(pts1, 'var(--border)', 1, '');
      curve(pts2, 'var(--border)', 1, '');
    }
    // 坐标轴
    seg(P(-1.25, -1.25, fz(-1.25, -1.25)), P(1.35, -1.25, fz(-1.25, -1.25)), 'var(--text-muted)', 1.6);
    txt(g, ...P(1.5, -1.25, fz(-1.25, -1.25)).concat(['x']), 'var(--text-muted)', 13, 'middle', '700');
    seg(P(-1.25, -1.25, fz(-1.25, -1.25)), P(-1.25, 1.35, fz(-1.25, -1.25)), 'var(--text-muted)', 1.6);
    txt(g, ...P(-1.25, 1.5, fz(-1.25, -1.25)).concat(['y']), 'var(--text-muted)', 13, 'middle', '700');
    seg(P(-1.25, -1.25, fz(-1.25, -1.25)), P(-1.25, -1.25, 1.32), 'var(--text-muted)', 1.6);
    txt(g, ...P(-1.25, -1.25, 1.45).concat(['z']), 'var(--text-muted)', 13, 'middle', '700');

    const y0 = 0.35, x0 = 0.45;

    if (f === 0) {
      txt(g, 700, 120, '曲面上的每一点', 'var(--text-muted)', 12, 'middle');
      txt(g, 700, 146, '都有「两个方向」的斜率', 'var(--text-muted)', 12, 'middle');
      txt(g, 700, 186, '沿 x 方向 → ∂f/∂x', 'var(--primary)', 13, 'middle', '700');
      txt(g, 700, 212, '沿 y 方向 → ∂f/∂y', 'var(--success)', 13, 'middle', '700');
      txt(g, 700, 252, '偏 = 偏袒一个变量：', 'var(--highlight)', 11.5, 'middle');
      txt(g, 700, 274, '只让一个动，另一个按住不变', 'var(--highlight)', 11.5, 'middle');
      txt(g, 460, 372, 'z = f(x,y) 的图形是一张「曲面」，不是一条曲线', 'var(--text-muted)', 12, 'middle');
    }

    if (f === 1 || f === 2 || f === 3) {
      // y = y0 平面（半透明四边形）
      const a = P(-1.2, y0, -1.6), b = P(1.2, y0, -1.6), c = P(1.2, y0, 1.6), d2 = P(-1.2, y0, 1.6);
      g.append('path').attr('d', 'M ' + a[0] + ' ' + a[1] + ' L ' + b[0] + ' ' + b[1] + ' L ' + c[0] + ' ' + c[1] + ' L ' + d2[0] + ' ' + d2[1] + ' Z')
        .attr('fill', 'var(--highlight)').attr('fill-opacity', 0.05).attr('stroke', 'var(--highlight)').attr('stroke-width', 1.4).attr('stroke-dasharray', '6,4');
      txt(g, 700, 354, '黄色虚线：切平面 y = y₀', 'var(--highlight)', 11, 'middle', '600');

      const pts = [];
      for (let i = 0; i <= 24; i++) {
        const x = -1.2 + 2.4 * i / 24;
        pts.push(P(x, y0, fz(x, y0)));
      }
      curve(pts, 'var(--highlight)', 3);

      if (f === 2 || f === 3) {
        const p0 = P(x0, y0, fz(x0, y0));
        circ(g, p0[0], p0[1], 6, 'var(--danger)');
        txt(g, p0[0] + 12, p0[1] - 10, 'P(x₀, y₀)', 'var(--danger)', 11.5, 'start', '700');
      }

      if (f === 3) {
        // 切线（在截线平面内）：dz/dx = 1.1 x
        const k = 1.1 * x0;
        const t1 = P(x0 - 0.6, y0, fz(x0, y0) - k * 0.6);
        const t2 = P(x0 + 0.6, y0, fz(x0, y0) + k * 0.6);
        g.append('line').attr('x1', t1[0]).attr('y1', t1[1]).attr('x2', t2[0]).attr('y2', t2[1])
          .attr('stroke', 'var(--danger)').attr('stroke-width', 3);
        txt(g, t2[0] + 8, t2[1] - 6, '切线', 'var(--danger)', 11.5, 'start', '700');
        txt(g, 700, 300, '∂f/∂x |P = 切线斜率', 'var(--danger)', 13, 'middle', '700');
        txt(g, 700, 326, '= lim [f(x₀+Δx,y₀)−f(x₀,y₀)]/Δx', 'var(--text-muted)', 10.5, 'middle');
      } else {
        txt(g, 700, 300, '曲面被切成一条「曲线」', 'var(--highlight)', 12.5, 'middle', '600');
        txt(g, 700, 326, '在这条线上，y 恒等于 y₀', 'var(--text-muted)', 11.5, 'middle');
      }
    }

    if (f === 4) {
      const a = P(x0, -1.2, -1.6), b = P(x0, 1.2, -1.6), c = P(x0, 1.2, 1.6), d2 = P(x0, -1.2, 1.6);
      g.append('path').attr('d', 'M ' + a[0] + ' ' + a[1] + ' L ' + b[0] + ' ' + b[1] + ' L ' + c[0] + ' ' + c[1] + ' L ' + d2[0] + ' ' + d2[1] + ' Z')
        .attr('fill', 'var(--primary)').attr('fill-opacity', 0.05).attr('stroke', 'var(--primary)').attr('stroke-width', 1.4).attr('stroke-dasharray', '6,4');
      txt(g, 700, 354, '蓝色虚线：切平面 x = x₀', 'var(--primary)', 11, 'middle', '600');
      const pts = [];
      for (let i = 0; i <= 24; i++) {
        const y = -1.2 + 2.4 * i / 24;
        pts.push(P(x0, y, fz(x0, y)));
      }
      curve(pts, 'var(--primary)', 3);
      const p0 = P(x0, y0, fz(x0, y0));
      const k = -1.1 * y0;
      const t1 = P(x0, y0 - 0.6, fz(x0, y0) - k * 0.6);
      const t2 = P(x0, y0 + 0.6, fz(x0, y0) + k * 0.6);
      g.append('line').attr('x1', t1[0]).attr('y1', t1[1]).attr('x2', t2[0]).attr('y2', t2[1])
        .attr('stroke', 'var(--success)').attr('stroke-width', 3);
      circ(g, p0[0], p0[1], 6, 'var(--danger)');
      txt(g, 700, 120, '同一个点 P，换个方向切', 'var(--primary)', 12.5, 'middle', '700');
      txt(g, 700, 160, '∂f/∂y |P = 这条切线的斜率', 'var(--success)', 12.5, 'middle', '700');
      txt(g, 700, 190, '求 f_y：把 x 按住不动', 'var(--text-muted)', 11.5, 'middle');
      txt(g, 700, 230, '两个偏导数通常不相等', 'var(--highlight)', 11.5, 'middle');
      txt(g, 700, 254, '（它们对应两个不同方向的斜率）', 'var(--text-muted)', 11, 'middle');
    }

    if (f === 5) {
      const lines = [
        ['f(x,y) = x²y + 3xy²', 'var(--text)', 13, 'start', '700'],
        ['求 fₓ：把 y 看成常数（数字）', 'var(--primary)', 12.5, 'start', '600'],
        ['fₓ = 2xy + 3y²', 'var(--primary)', 13, 'start', '700'],
        ['求 f_y：把 x 看成常数（数字）', 'var(--success)', 12.5, 'start', '600'],
        ['f_y = x² + 6xy', 'var(--success)', 13, 'start', '700'],
        ['二阶偏导：fₓₓ = 2y，fₓ_y = 2x + 6y', 'var(--highlight)', 12.5, 'start', '600'],
        ['（fₓ_y 与 f_yₓ 连续时相等）', 'var(--text-muted)', 11, 'start', '400']
      ];
      lines.forEach(function (l, i) {
        txt(g, 110, 96 + i * 42, l[0], l[1], l[2], l[3], l[4]);
      });
      box(g, 90, 78, 720, 300, 'var(--border)', 0.04);
      txt(g, 760, 360, '口诀：求谁谁动，另一个当常数', 'var(--primary-strong)', 12, 'end', '600');
    }
  
  document.getElementById('subtitle').textContent = step.desc;
}

function renderStep(i){ stepIdx = Math.max(0, Math.min(i, STEPS.length-1)); renderViz(); }
function stepNext(){ renderStep(stepIdx+1); }
function stepPrev(){ renderStep(stepIdx-1); }
function stopPlay(){ if(playTimer){clearInterval(playTimer);playTimer=null;} playing=false; document.getElementById('btn-play').textContent='▶ 播放'; }
function togglePlay(){ if(playing){stopPlay();return;} playing=true; document.getElementById('btn-play').textContent='⏸ 暂停'; playTimer=setInterval(function(){ if(stepIdx>=STEPS.length-1){stopPlay();return;} stepNext(); },1900); }

function renderDerive(){
  const el=document.getElementById('derive-katex');
  el.innerHTML = window.COURSEWARE_DATA.derivation.map(function(l){return '<div class="katex-holder">$$'+l+'$$</div>';}).join('');
  if(window.renderMathInElement) window.renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true}]});
  else if(window.katex){ el.innerHTML=''; window.COURSEWARE_DATA.derivation.forEach(function(l){const d=document.createElement('div');d.className='katex-holder';el.appendChild(d);window.katex.render(l,d,{displayMode:true});}); }
}
function renderContent(){
  const d=window.COURSEWARE_DATA;
  document.getElementById('intuition-text').innerHTML='<p>'+(d.intuition_text||'')+'</p>';
  document.getElementById('exam-text').innerHTML=(d.exam_text||'')+'<p style="color:var(--success);margin-top:8px;">'+(d.exam_answer||'')+'</p>';
  document.getElementById('pitfall-list').innerHTML=(d.pitfall_list||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  document.getElementById('quiz-list').innerHTML=(d.quiz_list||[]).map(function(q){
    return '<div class="quiz-item"><p>'+q.question+'</p>'+q.options.map(function(o,oi){return '<span class="opt" data-correct="'+(oi===q.correct?1:0)+'">'+o+'</span>';}).join('')+'</div>';
  }).join('');
  renderDerive();
}
function bindQuiz(){
  document.querySelectorAll('.quiz-item .opt').forEach(function(opt){
    opt.addEventListener('click',function(){
      const sib=opt.parentElement.querySelectorAll('.opt');
      sib.forEach(function(s){s.classList.remove('correct','wrong');});
      if(opt.dataset.correct==='1'){opt.classList.add('correct');}else{opt.classList.add('wrong');}
    });
  });
}
async function loadSkill(){
  if(location.protocol==='file:') return; // 双击本地打开时没有服务端，跳过技巧拉取，避免控制台报错
  const id = (window.COURSEWARE_DATA && window.COURSEWARE_DATA.id) || '';
  if(!id) return;
  try{
    const r=await fetch('/api/skills/'+id);
    if(!r.ok) return;
    const s=await r.json();
    if(s && s.skill_text){
      document.getElementById('skill-section').style.display='block';
      document.getElementById('skill-content').innerHTML=s.skill_text.split('\n').filter(function(x){return x.trim();}).map(function(x){return '<div style="margin:6px 0;">🎯 '+x+'</div>';}).join('');
    }
  }catch(e){}
}
function initTheme(){
  try{const s=localStorage.getItem('theme');if(s)document.documentElement.setAttribute('data-theme',s);}catch(e){}
  document.getElementById('theme-float-btn').textContent = document.documentElement.getAttribute('data-theme')==='light'?'☀️':'🌙';
}
document.getElementById('theme-float-btn').addEventListener('click',function(){
  const c=document.documentElement.getAttribute('data-theme');
  const n=c==='light'?'dark':'light';
  document.documentElement.setAttribute('data-theme',n);
  try{localStorage.setItem('theme',n);}catch(e){}
  document.getElementById('theme-float-btn').textContent = n==='light'?'☀️':'🌙';
});
function init(){
  renderContent(); loadSkill(); bindQuiz(); renderStep(0);
  document.getElementById('btn-next').addEventListener('click',stepNext);
  document.getElementById('btn-prev').addEventListener('click',stepPrev);
  document.getElementById('btn-play').addEventListener('click',togglePlay);
  document.getElementById('btn-reset').addEventListener('click',function(){stepIdx=0;stopPlay();renderStep(0);});
}
window.addEventListener('load',function(){
  initTheme();
  if(window.gsap) gsap.from('.section',{opacity:0,y:20,duration:0.6,stagger:0.12,ease:'power2.out'});
  init();
});
</script>
</body>
</html>
