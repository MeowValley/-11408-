<style>
:root { --bg:#0f1420; --bg-panel:#161d2e; --bg-elevated:#1d263b; --border:#2a3550; --text:#e6ebf5; --text-muted:#8b96ad; --primary:#4f8cff; --primary-strong:#6ea8ff; --highlight:#ffb020; --success:#2dd4a7; --compare:#ff6b6b; --swap:#ff9f43; --danger:#ff5c7a; --radius:12px; --shadow:0 6px 24px rgba(0,0,0,0.35); --font:"PingFang SC","Microsoft YaHei",-apple-system,sans-serif; }
[data-theme="light"] { --bg:#f5f7fa; --bg-panel:#fff; --bg-elevated:#f0f3f8; --border:#dde3ec; --text:#1a2333; --text-muted:#6b7688; --primary:#3b82f6; --primary-strong:#2563eb; --highlight:#f59e0b; --success:#10b981; --compare:#ef4444; --swap:#f97316; --danger:#ef4444; --shadow:0 4px 16px rgba(0,0,0,0.08); }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:var(--font); background:var(--bg); color:var(--text); line-height:1.65; -webkit-font-smoothing:antialiased; }
.page-wrap { max-width:1280px; margin:0 auto; padding:24px; }
header.course-header { display:flex; align-items:center; justify-content:space-between; padding:16px 24px; background:var(--bg-panel); border:1px solid var(--border); border-radius:var(--radius); margin-bottom:24px; }
.course-header h1 { font-size:22px; font-weight:700; }
.course-header .badge { font-size:12px; color:var(--primary-strong); border:1px solid var(--primary); padding:2px 10px; border-radius:999px; }
.section { background:var(--bg-panel); border:1px solid var(--border); border-radius:var(--radius); padding:24px; margin-bottom:24px; box-shadow:var(--shadow); }
.section h2 { font-size:18px; margin-bottom:16px; display:flex; align-items:center; gap:8px; }
.section h2 .num { width:26px; height:26px; border-radius:8px; background:var(--primary); color:#fff; display:inline-flex; align-items:center; justify-content:center; font-size:14px; font-weight:700; }
.focus-pulse { animation:breathe 1.6s ease-in-out infinite; }
@keyframes breathe { 0%,100%{box-shadow:0 0 0 0 rgba(255,176,32,0.7);} 50%{box-shadow:0 0 0 10px rgba(255,176,32,0);} }
.control-bar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:12px 16px; background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius); margin-bottom:16px; position:sticky; top:12px; z-index:10; }
.ctrl-btn { font-family:var(--font); font-size:14px; font-weight:600; color:var(--text); background:var(--bg-panel); border:1px solid var(--border); border-radius:8px; padding:8px 16px; cursor:pointer; transition:all .15s ease; }
.ctrl-btn:hover { border-color:var(--primary); color:var(--primary-strong); transform:translateY(-1px); }
.ctrl-btn.primary { background:var(--primary); color:#fff; border-color:var(--primary); }
.viz-panel { background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius); padding:16px; position:relative; min-height:440px; }
.viz-panel svg { width:100%; height:auto; }
.subtitle-bar { position:absolute; bottom:12px; left:50%; transform:translateX(-50%); background:var(--bg-elevated); border:1px solid var(--highlight); color:var(--highlight); padding:6px 16px; border-radius:999px; font-size:14px; font-weight:600; white-space:nowrap; max-width:92%; overflow:hidden; text-overflow:ellipsis; }
.pitfall-list { padding-left:16px; } .pitfall-list li { margin-bottom:8px; } .pitfall-list li::marker { color:var(--danger); }
.quiz-item { margin-bottom:16px; }
.quiz-item .opt { display:block; padding:8px 14px; margin-top:6px; background:var(--bg-elevated); border:1px solid var(--border); border-radius:8px; cursor:pointer; transition:all .15s; }
.quiz-item .opt:hover { border-color:var(--primary); }
.quiz-item .opt.correct { border-color:var(--success); color:var(--success); }
.quiz-item .opt.wrong { border-color:var(--danger); color:var(--danger); }
.katex-holder { margin:6px 0; }
.theme-float { position:fixed; top:14px; right:14px; z-index:9999; font-size:20px; background:var(--bg-panel); border:1px solid var(--border); border-radius:10px; padding:6px 12px; cursor:pointer; box-shadow:var(--shadow); }
@media(max-width:768px){ .control-bar{position:static;} }

/* ===== 移动端适配补丁（统一追加：公式可横向滚动、标题栏可换行、字幕可换行） ===== */

header.course-header{flex-wrap:wrap;gap:8px}
header.course-header h1{min-width:0;word-break:break-word}

  .subtitle-bar{white-space:normal;max-width:94%;line-height:1.35;font-size:12.5px;text-align:center}
  header.course-header h1{font-size:18px}
}

<body>
<div class="page-wrap">
<header class="course-header"><h1>求导法则（四则运算、复合函数、隐函数、参数方程、反函数）</h1><span class="badge">B级 · MA-10</span></header>

<section class="section" id="intuition-section">
<h2><span class="num">1</span>直觉引入</h2>
<div id="intuition-text">求导的核心工具链：<strong>四则法则</strong>（和差直接拆、乘积 (uv)′=u′v+uv′、商法则）、<strong>复合函数链式法则</strong>（dy/dx = dy/du · du/dx，洋葱一层层剥）、<strong>隐函数求导</strong>（方程两边同时对 x 求导，把 y 当 y(x)）、<strong>参数方程求导</strong>（dy/dx = y′(t)/x′(t)）、<strong>反函数求导</strong>（dx/dy = 1/(dy/dx)）。</div>
</section>

<section class="section" id="animation-section">
<h2><span class="num">2</span>核心动画</h2>
<div class="control-bar">
<button class="ctrl-btn primary" id="btn-play">▶ 播放</button>
<button class="ctrl-btn" id="btn-prev">⏮ 上一步</button>
<button class="ctrl-btn" id="btn-next">⏭ 下一步</button>
<button class="ctrl-btn" id="btn-reset">↺ 重置</button>
</div>
<div class="viz-panel"><svg id="viz"></svg><div class="subtitle-bar" id="subtitle"></div></div>
</section>

<section class="section" id="derive-section">
<h2><span class="num">3</span>公式推导</h2>
<div id="derive-katex"></div>
</section>

<section class="section" id="exam-section">
<h2><span class="num">4</span>历年真题实战</h2>
<div id="exam-text"></div>
</section>

<section class="section" id="skill-section" style="display:none;">
<h2><span class="num">💡</span>做题技巧</h2>
<div id="skill-content" style="line-height:1.9;"></div>
</section>
<section class="section" id="pitfall-section">
<h2><span class="num">5</span>易错点</h2>
<ul class="pitfall-list" id="pitfall-list"></ul>
</section>

<section class="section" id="quiz-section">
<h2><span class="num">6</span>自测</h2>
<div id="quiz-list"></div>
</section>
</div>

<button class="theme-float" id="theme-float-btn">🌙</button>

<script>
window.COURSEWARE_DATA = {
  id: "MA-10",
  title: "求导法则（四则运算、复合函数、隐函数、参数方程、反函数）",
  derivation: ["(uv)' = u'v + uv', \\qquad \\left(\\frac{u}{v}\\right)' = \\frac{u'v-uv'}{v^2}","\\text{链式}: \\; \\frac{dy}{dx} = \\frac{dy}{du}\\cdot\\frac{du}{dx}","\\text{参数方程}: \\; \\frac{dy}{dx} = \\frac{y'(t)}{x'(t)}","\\text{反函数}: \\; \\frac{dx}{dy} = \\frac{1}{dy/dx}"],
  exam_text: "<b>【2020 真题改编】</b>设 y = sin(x²)，求 y′；设 x = t − sin t, y = 1 − cos t，求 dy/dx。",
  exam_answer: "答案：① y=sin(x²) 是复合函数，外层 sin 导数为 cos(x²)，内层 x² 导数为 2x，故 <b>y′ = 2x·cos(x²)</b>。② 参数方程：x′(t)=1−cos t，y′(t)=sin t，故 <b>dy/dx = sin t / (1−cos t)</b>。链式法则的关键是「由外向内、逐层相乘」，不要漏掉内层导数。",
  pitfall_list: ["乘积法则不是「各自求导再相乘」——必须用 (uv)′=u′v+uv′。","链式法则极易漏乘内层导数（如 sin 2x 的导数应为 2cos 2x）。","参数方程求导是 y′(t)/x′(t)，不是 x′(t)/y′(t)——分子分母别弄反。"],
  quiz_list: [{"question":"(uv)′ 等于？","options":["u′v′","u′v + uv′","u′v − uv′"],"correct":1},{"question":"y = e^(2x) 的导数是？","options":["e^(2x)","2e^(2x)","2xe^(2x)"],"correct":1},{"question":"参数方程 dy/dx 等于？","options":["x′(t)/y′(t)","y′(t)/x′(t)","y(t)/x(t)"],"correct":1}],
  intuition_text: "求导的核心工具链：四则法则（和差直接拆、乘积 (uv)′=u′v+uv′、商法则）、复合函数链式法则（dy/dx = dy/du · du/dx，洋葱一层层剥）、隐函数求导（方程两边同时对 x 求导，把 y 当 y(x)）、参数方程求导（dy/dx = y′(t)/x′(t)）、反函数求导（dx/dy = 1/(dy/dx)）。"
};

/* ===== MA-10 专属动画：求导法则（四则运算、复合函数、隐函数、参数方程、反函数） ===== */
const STEPS = [{"focus":0,"desc":"四则法则：和差、乘积、商各自的计算规则"},{"focus":1,"desc":"复合函数链式法则：洋葱式逐层求导相乘"},{"focus":2,"desc":"隐函数求导：方程两边对 x 求导，y 视为 y(x)"},{"focus":3,"desc":"参数方程与反函数：dy/dx = y′/x′，dx/dy = 1/(dy/dx)"}];

let stepIdx = 0, playing = false, playTimer = null;

/* —— 通用几何工具（仅坐标/样式辅助，每个知识点的动画编排均为独立手写） —— */
function box(g,x,y,w,h,stroke,fillOp,rx){
  g.append('rect').attr('x',x).attr('y',y).attr('width',w).attr('height',h).attr('rx',rx===undefined?8:rx)
    .attr('fill',stroke).attr('fill-opacity',fillOp===undefined?0.1:fillOp).attr('stroke',stroke).attr('stroke-width',2);
}
function txt(g,x,y,s,fill,size,anchor,weight){
  g.append('text').attr('x',x).attr('y',y).attr('text-anchor',anchor||'middle')
    .attr('fill',fill||'var(--text)').attr('font-size',size||13).attr('font-weight',weight||400).text(s);
}
function ln(g,x1,y1,x2,y2,stroke,sw,dash){
  g.append('line').attr('x1',x1).attr('y1',y1).attr('x2',x2).attr('y2',y2)
    .attr('stroke',stroke).attr('stroke-width',sw||1.6).attr('stroke-dasharray',dash||'');
}
function arw(g,x1,y1,x2,y2,color,dash){
  g.append('line').attr('x1',x1).attr('y1',y1).attr('x2',x2).attr('y2',y2)
    .attr('stroke',color).attr('stroke-width',2).attr('stroke-dasharray',dash||'').attr('marker-end','url(#arwGen)');
}
function circ(g,cx,cy,r,fill,stroke,sw){
  g.append('circle').attr('cx',cx).attr('cy',cy).attr('r',r).attr('fill',fill)
    .attr('stroke',stroke||'none').attr('stroke-width',sw||0);
}
function chip(g,x,y,w,h,label,color,sub){
  box(g,x,y,w,h,color,0.14);
  txt(g,x+w/2,y+(sub?h/2-4:h/2+5),label,color,13,'middle','700');
  if(sub) txt(g,x+w/2,y+h/2+14,sub,'var(--text-muted)',10.5);
}
function title(g,s){
  txt(g,450,28,s,'var(--primary-strong)',15,'middle','700');
}
function plot(g,f,x0,y0,w,h,color,sw){
  let d='';
  for(let i=0;i<=100;i++){
    const t=i/100, x=x0+w*t, y=y0-h*f(t);
    d+=(i?' L ':'M ')+x.toFixed(1)+' '+y.toFixed(1);
  }
  g.append('path').attr('d',d).attr('fill','none').attr('stroke',color).attr('stroke-width',sw||2.2);
}

function renderViz(){
  const svg = d3.select('#viz');
  svg.selectAll('*').remove();
  const W = 900, H = 400;
  svg.attr('viewBox', '0 0 ' + W + ' ' + H);
  const g = svg.append('g');
  const step = STEPS[stepIdx];
  const f = step.focus;
  const defs = svg.append('defs');
  defs.append('marker').attr('id','arwGen').attr('viewBox','0 0 10 10').attr('refX',9).attr('refY',5)
    .attr('markerWidth',7).attr('markerHeight',7).attr('orient','auto-start-reverse')
    .append('path').attr('d','M 0 0 L 10 5 L 0 10 z').attr('fill','var(--primary-strong)');
  
      title(g, ['四则法则', '链式法则', '隐函数求导', '参数方程 / 反函数'][f]);
      if (f === 0) {
        const rows = [["(u ± v)′ = u′ ± v′", '和差：直接拆开'], ["(uv)′ = u′v + uv′", '乘积：轮流求导相加'], ["(u/v)′ = (u′v − uv′)/v²", '商：分子减、分母平方']];
        rows.forEach(function (r, i) {
          box(g, 80, 80 + i * 90, 740, 74, ['var(--primary)', 'var(--success)', 'var(--highlight)'][i], 0.1);
          txt(g, 110, 112 + i * 90, r[0], 'var(--text)', 14, 'start', '700');
          txt(g, 110, 138 + i * 90, r[1], 'var(--text-muted)', 11.5, 'start');
        });
        txt(g, 450, 370, '记忆：乘积「前导后不导 + 前不导后导」', 'var(--text-muted)', 12);
      }
      if (f === 1) {
        [['y = sin(u)', 660, 90], ['u = x²', 660, 200]].forEach(function (n) {
          box(g, 470, n[2] - 40, 200, 66, 'var(--primary)', 0.1);
          txt(g, 570, n[2] + 2, n[0], 'var(--text)', 14);
        });
        box(g, 90, 140, 240, 70, 'var(--success)', 0.12);
        txt(g, 210, 172, 'dy/dx = ?', 'var(--success)', 15, 'middle', '700');
        arw(g, 330, 175, 470, 120, 'var(--highlight)');
        arw(g, 330, 175, 470, 205, 'var(--highlight)');
        txt(g, 700, 300, "dy/dx = dy/du · du/dx", 'var(--primary-strong)', 14, 'middle', '700');
        txt(g, 700, 330, '= cos(u) · 2x = 2x·cos(x²)', 'var(--text)', 13);
        txt(g, 450, 370, '由外向内，逐层求导、逐层相乘', 'var(--text-muted)', 12);
      }
      if (f === 2) {
        box(g, 80, 70, 740, 70, 'var(--highlight)', 0.08);
        txt(g, 450, 100, '方程 F(x,y)=0 两边同时对 x 求导', 'var(--highlight)', 14, 'middle', '700');
        txt(g, 450, 124, '把 y 看作 y(x)，遇到 y 就乘 y′', 'var(--text-muted)', 11.5);
        box(g, 180, 175, 540, 70, 'var(--primary)', 0.08);
        txt(g, 450, 205, '例：x² + y² = 1', 'var(--text)', 14, 'middle', '700');
        txt(g, 450, 230, '2x + 2y·y′ = 0  ⟹  y′ = −x/y', 'var(--primary-strong)', 13);
        txt(g, 450, 300, '关键：y² 求导得 2y·y′（链式法则的隐式应用）', 'var(--text-muted)', 12);
        txt(g, 450, 335, '别忘了 y′ 这一项！', 'var(--danger)', 12.5, 'middle', '700');
      }
      if (f === 3) {
        box(g, 70, 70, 360, 220, 'var(--primary)', 0.08);
        txt(g, 250, 105, '参数方程', 'var(--primary-strong)', 15, 'middle', '700');
        txt(g, 250, 145, 'x = x(t),  y = y(t)', 'var(--text)', 13);
        txt(g, 250, 190, 'dy/dx = y′(t) / x′(t)', 'var(--highlight)', 15, 'middle', '700');
        txt(g, 250, 230, '例：x=t−sin t, y=1−cos t', 'var(--text-muted)', 11.5);
        txt(g, 250, 255, 'dy/dx = sin t/(1−cos t)', 'var(--text)', 12);
        box(g, 470, 70, 360, 220, 'var(--success)', 0.08);
        txt(g, 650, 105, '反函数', 'var(--success)', 15, 'middle', '700');
        txt(g, 650, 145, 'y = f(x) 的反函数 x = f⁻¹(y)', 'var(--text)', 13);
        txt(g, 650, 190, 'dx/dy = 1 / (dy/dx)', 'var(--highlight)', 15, 'middle', '700');
        txt(g, 650, 230, '即反函数导数 = 原函数导数的倒数', 'var(--text-muted)', 11.5);
        txt(g, 650, 255, '例：(arcsin x)′ = 1/√(1−x²)', 'var(--text)', 12);
      }
    
  document.getElementById('subtitle').textContent = step.desc;
}

function renderStep(i){ stepIdx = Math.max(0, Math.min(i, STEPS.length-1)); renderViz(); }
function stepNext(){ renderStep(stepIdx+1); }
function stepPrev(){ renderStep(stepIdx-1); }
function stopPlay(){ if(playTimer){clearInterval(playTimer);playTimer=null;} playing=false; document.getElementById('btn-play').textContent='▶ 播放'; }
function togglePlay(){ if(playing){stopPlay();return;} playing=true; document.getElementById('btn-play').textContent='⏸ 暂停'; playTimer=setInterval(function(){ if(stepIdx>=STEPS.length-1){stopPlay();return;} stepNext(); },1900); }

function renderDerive(){
  const el=document.getElementById('derive-katex');
  el.innerHTML = window.COURSEWARE_DATA.derivation.map(function(l){return '<div class="katex-holder">$$'+l+'$$</div>';}).join('');
  if(window.renderMathInElement) window.renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true}]});
  else if(window.katex){ el.innerHTML=''; window.COURSEWARE_DATA.derivation.forEach(function(l){const d=document.createElement('div');d.className='katex-holder';el.appendChild(d);window.katex.render(l,d,{displayMode:true});}); }
}
function renderContent(){
  const d=window.COURSEWARE_DATA;
  document.getElementById('intuition-text').innerHTML='<p>'+(d.intuition_text||'')+'</p>';
  document.getElementById('exam-text').innerHTML=(d.exam_text||'')+'<p style="color:var(--success);margin-top:8px;">'+(d.exam_answer||'')+'</p>';
  document.getElementById('pitfall-list').innerHTML=(d.pitfall_list||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  document.getElementById('quiz-list').innerHTML=(d.quiz_list||[]).map(function(q){
    return '<div class="quiz-item"><p>'+q.question+'</p>'+q.options.map(function(o,oi){return '<span class="opt" data-correct="'+(oi===q.correct?1:0)+'">'+o+'</span>';}).join('')+'</div>';
  }).join('');
  renderDerive();
}
function bindQuiz(){
  document.querySelectorAll('.quiz-item .opt').forEach(function(opt){
    opt.addEventListener('click',function(){
      const sib=opt.parentElement.querySelectorAll('.opt');
      sib.forEach(function(s){s.classList.remove('correct','wrong');});
      if(opt.dataset.correct==='1'){opt.classList.add('correct');}else{opt.classList.add('wrong');}
    });
  });
}
async function loadSkill(){
  if(location.protocol==='file:') return; // 双击本地打开时没有服务端，跳过技巧拉取，避免控制台报错
  const id = (window.COURSEWARE_DATA && window.COURSEWARE_DATA.id) || '';
  if(!id) return;
  try{
    const r=await fetch('/api/skills/'+id);
    if(!r.ok) return;
    const s=await r.json();
    if(s && s.skill_text){
      document.getElementById('skill-section').style.display='block';
      document.getElementById('skill-content').innerHTML=s.skill_text.split('\n').filter(function(x){return x.trim();}).map(function(x){return '<div style="margin:6px 0;">🎯 '+x+'</div>';}).join('');
    }
  }catch(e){}
}
function initTheme(){
  try{const s=localStorage.getItem('theme');if(s)document.documentElement.setAttribute('data-theme',s);}catch(e){}
  document.getElementById('theme-float-btn').textContent = document.documentElement.getAttribute('data-theme')==='light'?'☀️':'🌙';
}
document.getElementById('theme-float-btn').addEventListener('click',function(){
  const c=document.documentElement.getAttribute('data-theme');
  const n=c==='light'?'dark':'light';
  document.documentElement.setAttribute('data-theme',n);
  try{localStorage.setItem('theme',n);}catch(e){}
  document.getElementById('theme-float-btn').textContent = n==='light'?'☀️':'🌙';
});
function init(){
  renderContent(); loadSkill(); bindQuiz(); renderStep(0);
  document.getElementById('btn-next').addEventListener('click',stepNext);
  document.getElementById('btn-prev').addEventListener('click',stepPrev);
  document.getElementById('btn-play').addEventListener('click',togglePlay);
  document.getElementById('btn-reset').addEventListener('click',function(){stepIdx=0;stopPlay();renderStep(0);});
}
window.addEventListener('load',function(){
  initTheme();
  if(window.gsap) gsap.from('.section',{opacity:0,y:20,duration:0.6,stagger:0.12,ease:'power2.out'});
  init();
});
</script>
